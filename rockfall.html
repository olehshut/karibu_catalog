/* ================= круги сложности ================= */
const RINGS = 5, PER_RING = 16, TOTAL = RINGS * PER_RING;
const RING_TIME  = [1.00, 0.94, 0.88, 0.82, 0.76];   // множитель времени
const NEED_STEP  = {A:2,B:2,C:2,D:1,E:1,F:2,G:2,H:2,I:2,J:1,K:1,L:2,M:2,N:1,O:4,P:1};
const RING_SEED  = [0, 0x1f83d9ab, 0x5be0cd19, 0x9b05688c, 0x1f83d9b5];

// Уровень n (0..79) — та же пещера, но другое зерно, норма, время и цена алмаза.
function levelSpec(n){
  const ring = Math.floor(n / PER_RING);
  const base = CAVES[n % PER_RING];
  const mul  = ring + 1;
  return Object.assign({}, base, {
    seed:  (base.seed ^ RING_SEED[ring]) >>> 0,
    need:  base.need + (NEED_STEP[base.id] || 1) * ring,
    time:  Math.round(base.time * RING_TIME[ring]),
    dval:  base.dval  * mul,
    eval_: base.eval_ * mul,
    magic:      base.magic      ? Math.round(base.magic * RING_TIME[ring]) : base.magic,
    amoebaTime: base.amoebaTime ? Math.round(base.amoebaTime * RING_TIME[ring]) : base.amoebaTime,
    ring: ring, num: n + 1, mul: mul
  });
}
// Бонусная пещера после каждого восьмого уровня.
function bonusSpec(n){
  const b = BONUS[Math.floor(n / 8) % BONUS.length];
  return Object.assign({}, b, {
    seed: (b.seed ^ RING_SEED[Math.floor(n / PER_RING)]) >>> 0,
    dval: b.dval * (Math.floor(n / PER_RING) + 1),
    eval_: b.eval_ * (Math.floor(n / PER_RING) + 1),
    bonus: true, num: n + 1
  });
}

/* ================= сборка каверны ================= */
function buildCave(cv){
  const g = new Uint8Array(W*H);
  const rand = rng(cv.seed);
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    let t;
    if (x===0||y===0||x===W-1||y===H-1) t = T.STEEL;
    else {
      t = T.DIRT;
      const r = rand();
      let acc = 0;
      for (const [tile,p] of cv.fill){ acc += p; if (r < acc){ t = tile; break; } }
    }
    g[y*W+x] = t;
  }
  const put = (x,y,t)=>{ if (x>0&&y>0&&x<W-1&&y<H-1) g[y*W+x]=t; };
  for (const o of (cv.obj||[])){
    const k = o[0];
    if (k==='pt') put(o[1],o[2],o[3]);
    else if (k==='frect'){ for(let y=o[2];y<=o[4];y++) for(let x=o[1];x<=o[3];x++) put(x,y,o[5]); }
    else if (k==='rect'){
      for(let x=o[1];x<=o[3];x++){ put(x,o[2],o[5]); put(x,o[4],o[5]); }
      for(let y=o[2];y<=o[4];y++){ put(o[1],y,o[5]); put(o[3],y,o[5]); }
    }
    else if (k==='line'){
      const n = Math.max(Math.abs(o[3]-o[1]), Math.abs(o[4]-o[2]));
      const sx = Math.sign(o[3]-o[1]), sy = Math.sign(o[4]-o[2]);
      for(let i=0;i<=n;i++) put(o[1]+sx*i, o[2]+sy*i, o[5]);
    }
  }
  return g;
}

    px(c,2,2,4,3,cols[(f+1)%3]); px(c,10,10,4,3,cols[(f+2)%3]);
  }));
  A.magicdead = [spr(c=>{
    px(c,0,0,16,16,'#404040');
    px(c,0,7,16,1,'#202020'); px(c,7,0,1,7,'#202020'); px(c,0,8,1,8,'#202020');
  })];
  // слизь
  A.slime = [0,1,2,3].map(f=>spr(c=>{
    px(c,0,0,16,16,'#204858');
    const r = rng(0x2000+f*91);
    for(let i=0;i<20;i++){
      const x=(r()*14)|0, y=(r()*14)|0;
      px(c,x,y,3,2, i%2? '#3c8098':'#102c38');
    }
  }));
  // растущая стена
  A.expand = [spr(c=>{
    px(c,0,0,16,16,pal.wall);
    px(c,0,0,16,1,pal.wallL); px(c,0,7,16,1,pal.wallD); px(c,0,15,16,1,pal.wallD);
    px(c,0,0,2,16,pal.wallL); px(c,14,0,2,16,pal.wallL);
  })];
  // взрыв
  A.boom = [0,1,2,3].map(f=>spr(c=>{
    const sz = [4,8,14,10][f], col = ['#f0d000','#ffffff','#ffffff','#f08000'][f];
    const o = (16-sz)>>1;
    px(c,o,o,sz,sz,col);
    if (f>0){ const i=(16-sz+4)>>1; px(c,i,i,sz-4,sz-4,'#f0d000'); }
  }));
  A.birth = [0,1,2,3].map(f=>spr(c=>{
    const sz = [14,10,8,10][f];
    const o = (16-sz)>>1;
    px(c,o,o,sz,sz, f<2? '#ffffff':'#00d8f0');
  }));
  A.inbox = [0,1].map(f=>spr(c=>{
    steel(c);
    if (f) px(c,4,4,8,8,'#ffffff'); else px(c,4,4,8,8,'#181818');
  }));
  // Рокфорд
  const idle = art(ART_PLAYER,PCOL), blink = art(ART_BLINK,PCOL), walk = art(ART_WALK,PCOL);
  A.player = [idle,idle,idle,blink];
  A.walkR = [walk,idle];
  A.walkL = [mirror(walk),idle];
  return A;
}

/* ================= звук ================= */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function noise(dur,f0,f1,vol){
  const c = ac(); if(!c) return;
  const n = c.sampleRate*dur|0, b = c.createBuffer(1,n,c.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const s = c.createBufferSource(); s.buffer = b;
  const f = c.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(f0,c.currentTime);
  f.frequency.exponentialRampToValueAtTime(f1,c.currentTime+dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}
function tone(f0,f1,dur,vol,type){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'square';
  o.frequency.setValueAtTime(f0,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),c.currentTime+dur);
  g.gain.setValueAtTime(vol,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
}
const SFX = {
  dig:    ()=>noise(0.06,900,300,0.10),
  step:   ()=>noise(0.04,600,300,0.05),
  gem:    ()=>tone(900,1800,0.10,0.10),
  rock:   ()=>noise(0.10,220,60,0.16),
  boom:   ()=>noise(0.55,900,50,0.30),
  push:   ()=>noise(0.09,300,120,0.10),
  open:   ()=>{ tone(500,700,0.08,0.10); setTimeout(()=>tone(700,900,0.08,0.10),90); setTimeout(()=>tone(900,1300,0.14,0.10),180); },
  done:   ()=>{ [600,800,1000,1400].forEach((f,i)=>setTimeout(()=>tone(f,f*1.2,0.12,0.10),i*90)); },
  die:    ()=>tone(400,60,0.7,0.16,'sawtooth'),
  tick:   ()=>tone(1500,1500,0.03,0.05)
};

/* ================= состояние игры ================= */
const G = {
  g:null, fall:null, dir:null, ph:null, scn:null,
  cave:null, ci:0, pal:null, atlas:null,
  px:0, py:0, alive:true, born:0,
  lvl:0, bonus:false, rnd:null, log:null, scoreAtStart:0,
  need:0, got:0, score:0, lives:10, time:0, subtick:0,
  magicState:0, magicTimer:0,
  amoebaCount:0, amoebaGrow:false, amoebaFast:false, amoebaTimer:0, amoebaConvert:0,
  camx:0, camy:0, state:'menu', frame:0, pushCount:0,
  exitOpen:false, endTimer:0, overview:false
};
const keys = {};
let cv, ctx, panel, overlay;

const idx = (x,y)=> y*W+x;
const get = (x,y)=> (x<0||y<0||x>=W||y>=H) ? T.STEEL : G.g[y*W+x];
const setT = (x,y,t)=>{ G.g[y*W+x] = t; };

/* ================= запуск уровня ================= */
function startLevel(n, isBonus, keepScore){
  const cv0 = isBonus ? bonusSpec(n) : levelSpec(n);
  G.lvl = n; G.bonus = !!isBonus; G.cave = cv0;
  G.pal = PALETTES[cv0.pal];
  G.atlas = buildAtlas(G.pal);
  G.g = buildCave(cv0);
  G.fall = new Uint8Array(W*H);
  G.dir  = new Uint8Array(W*H);
  G.ph   = new Uint8Array(W*H);
  G.scn  = new Uint8Array(W*H);
  G.need = cv0.need; G.got = 0;
  G.time = cv0.time; G.subtick = 0;
  G.alive = true; G.born = 14; G.endTimer = 0; G.exitOpen = false;
  G.magicState = 0; G.magicTimer = Math.round((cv0.magic||0) * 1000/TICK);
  G.amoebaTimer = Math.round((cv0.amoebaTime||0) * 1000/TICK);
  G.amoebaFast = false; G.amoebaConvert = 0;
  G.pushCount = 0;
  if (!keepScore){ G.score = 0; G.lives = 10; }
  G.scoreAtStart = G.score;              // при смерти очки этой попытки сгорают
  G.rnd = rng((cv0.seed ^ 0x5f3a71c9) >>> 0);   // вся случайность в игре — из зерна уровня
  G.log = [];                                    // журнал ввода для серверной проверки
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    if (G.g[idx(x,y)]===T.PLAYER){ G.px=x; G.py=y; setT(x,y,T.INBOX); }
  }
  G.camx = clamp(G.px-(VW>>1),0,W-VW);
  G.camy = clamp(G.py-(VH>>1),0,H-VH);
  if (G.bonus) G.exitOpen = true;
  G.state = 'play';
  hideOverlay();
  updateHud();
}
function advance(){
  if (G.bonus){ startLevel(G.lvl+1, false, true); return; }
  if ((G.lvl+1) % 8 === 0 && G.lvl+1 < TOTAL){ startLevel(G.lvl, true, true); return; }
  if (G.lvl+1 >= TOTAL){ G.state = 'over'; showVictory(); return; }
  startLevel(G.lvl+1, false, true);
}
const clamp = (v,a,b)=> v<a?a : v>b?b : v;

/* ================= взрыв ================= */
function explode(x,y,intoDiamonds){
  SFX.boom();
  for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
    const nx = x+dx, ny = y+dy;
    if (nx<1||ny<1||nx>=W-1||ny>=H-1) continue;
    const t = G.g[idx(nx,ny)];
    if (t===T.STEEL || t===T.EXIT) continue;
    if (t===T.PLAYER) killPlayer(false);
    G.g[idx(nx,ny)] = intoDiamonds ? T.BIRTH : T.BOOM;
    G.ph[idx(nx,ny)] = 4;
    G.fall[idx(nx,ny)] = 0;
    G.scn[idx(nx,ny)] = 1;
  }
}
function killPlayer(withBoom){
  if (!G.alive) return;
  G.alive = false;
  G.endTimer = 22;
  SFX.die();
  if (withBoom) explode(G.px,G.py,false);
}

/* ================= движение игрока ================= */
function playerStep(){
  if (G.born > 0){
    G.born--;
    if (G.born === 0){ setT(G.px,G.py,T.PLAYER); }
    return;
  }
  if (!G.alive) return;
  let d = -1;
  if (keys.up) d = 0; else if (keys.right) d = 1;
  else if (keys.down) d = 2; else if (keys.left) d = 3;
  if (d < 0){ G.pushCount = 0; return; }
  const grab = !!keys.grab;
  const nx = G.px + DX[d], ny = G.py + DY[d];
  const t = get(nx,ny);

  if (t===T.STEEL || t===T.BRICK || t===T.EXIT || t===T.MAGIC ||
      t===T.SLIME || t===T.EXPAND || t===T.FIREFLY || t===T.BUTTERFLY || t===T.AMOEBA){
    if (t===T.FIREFLY||t===T.BUTTERFLY||t===T.AMOEBA) return;
    return;
  }
  if (t===T.BOULDER){
    if (DY[d]!==0) return;                       // валун вверх/вниз не двигается
    if (G.fall[idx(nx,ny)]) return;
    if (get(nx+DX[d],ny)!==T.EMPTY) return;
    G.pushCount++;
    if (G.pushCount < 3){ SFX.push(); return; }  // сопротивление, как в оригинале
    G.pushCount = 0;
    setT(nx+DX[d],ny,T.BOULDER);
    G.fall[idx(nx+DX[d],ny)] = 0;
    setT(nx,ny,T.EMPTY);
    SFX.rock();
    if (grab) return;
    movePlayerTo(nx,ny);
    return;
  }
  G.pushCount = 0;
  if (t===T.DIAMOND){
    collect();
    if (grab){ setT(nx,ny,T.EMPTY); return; }
    setT(nx,ny,T.EMPTY);
    movePlayerTo(nx,ny);
    return;
  }
  if (t===T.EXITOPEN){
    setT(G.px,G.py,T.EMPTY);
    G.state = 'won'; G.endTimer = 30;
    SFX.done();
    return;
  }
  if (t===T.DIRT){
    SFX.dig();
    if (grab){ setT(nx,ny,T.EMPTY); return; }
    setT(nx,ny,T.EMPTY);
    movePlayerTo(nx,ny);
    return;
  }
  if (t===T.EMPTY){
    if (grab) return;
    SFX.step();
    movePlayerTo(nx,ny);
  }
}
function movePlayerTo(nx,ny){
  setT(G.px,G.py,T.EMPTY);
  G.px = nx; G.py = ny;
  setT(nx,ny,T.PLAYER);
  G.scn[idx(nx,ny)] = 1;
}
function collect(){
  G.got++;
  G.score += (G.got > G.need) ? G.cave.eval_ : G.cave.dval;
  SFX.gem();
  if (G.got === G.need){ openExit(); }
}
function openExit(){
  G.exitOpen = true;
  SFX.open();
  for (let i=0;i<W*H;i++) if (G.g[i]===T.EXIT) G.g[i] = T.EXITOPEN;
}

/* ================= падающие объекты ================= */
function stepFalling(x,y,t){
  const below = get(x,y+1);
  const i = idx(x,y);
  const falling = G.fall[i];

  if (below===T.EMPTY){
    G.g[i] = T.EMPTY; G.fall[i] = 0;
    const j = idx(x,y+1);
    G.g[j] = t; G.fall[j] = 1; G.scn[j] = 1;
    return;
  }
  if (below===T.MAGIC){
    if (!falling){ G.fall[i]=0; return; }
    if (G.magicState===0){ G.magicState = 1; }
    if (G.magicState===1){
      const ty = y+2;
      const out = (t===T.BOULDER) ? T.DIAMOND : T.BOULDER;
      if (get(x,ty)===T.EMPTY){
        G.g[idx(x,ty)] = out; G.fall[idx(x,ty)] = 1; G.scn[idx(x,ty)] = 1;
      }
      G.g[i] = T.EMPTY; G.fall[i] = 0;
      SFX.gem();
    } else {
      G.fall[i] = 0;
    }
    return;
  }
  if (below===T.SLIME && falling){
    if (G.rnd() < (G.cave.slime||0.15) && get(x,y+2)===T.EMPTY){
      G.g[i] = T.EMPTY; G.fall[i] = 0;
      G.g[idx(x,y+2)] = t; G.fall[idx(x,y+2)] = 1; G.scn[idx(x,y+2)] = 1;
    }
    return;
  }
  if (falling){
    if (below===T.PLAYER){ killPlayer(true); return; }
    if (below===T.FIREFLY || below===T.BUTTERFLY){
      explode(x,y+1, below===T.BUTTERFLY);
      return;
    }
    if (below===T.AMOEBA){ G.fall[i] = 0; return; }
  }
  if (ROUND[below] && !G.fall[idx(x,y+1)]){
    if (get(x-1,y)===T.EMPTY && get(x-1,y+1)===T.EMPTY){
      G.g[i] = T.EMPTY; G.fall[i] = 0;
      G.g[idx(x-1,y)] = t; G.fall[idx(x-1,y)] = 1; G.scn[idx(x-1,y)] = 1;
      return;
    }
    if (get(x+1,y)===T.EMPTY && get(x+1,y+1)===T.EMPTY){
      G.g[i] = T.EMPTY; G.fall[i] = 0;
      G.g[idx(x+1,y)] = t; G.fall[idx(x+1,y)] = 1; G.scn[idx(x+1,y)] = 1;
      return;
    }
  }
  if (falling){ SFX.rock(); }
  G.fall[i] = 0;
}

/* ================= враги ================= */
function stepBug(x,y,t){
  const i = idx(x,y);
  // рядом игрок или амёба — взрыв
  for (let d=0; d<4; d++){
    const n = get(x+DX[d], y+DY[d]);
    if (n===T.PLAYER || n===T.AMOEBA){ explode(x,y, t===T.BUTTERFLY); return; }
  }
  const cw = (t===T.BUTTERFLY);            // бабочка держится правой стены, светлячок — левой
  const dir = G.dir[i];
  const turn = cw ? (dir+1)&3 : (dir+3)&3;
  const tx = x+DX[turn], ty = y+DY[turn];
  if (get(tx,ty)===T.EMPTY){
    G.g[i] = T.EMPTY; G.fall[i] = 0;
    const j = idx(tx,ty);
    G.g[j] = t; G.dir[j] = turn; G.scn[j] = 1;
    return;
  }
  const fx = x+DX[dir], fy = y+DY[dir];
  if (get(fx,fy)===T.EMPTY){
    G.g[i] = T.EMPTY;
    const j = idx(fx,fy);
    G.g[j] = t; G.dir[j] = dir; G.scn[j] = 1;
    return;
  }
  G.dir[i] = cw ? (dir+3)&3 : (dir+1)&3;
}

/* ================= амёба ================= */
function stepAmoeba(x,y){
  const i = idx(x,y);
  G.amoebaCount++;
  let free = false;
  for (let d=0; d<4; d++){
    const n = get(x+DX[d], y+DY[d]);
    if (n===T.EMPTY || n===T.DIRT){ free = true; break; }
  }
  if (free) G.amoebaGrow = true;
  if (G.amoebaConvert){
    G.g[i] = (G.amoebaConvert===1) ? T.BOULDER : T.DIAMOND;
    G.fall[i] = 0;
    return;
  }
  if (!free) return;
  const chance = G.amoebaFast ? 0.25 : 0.03;
  if (G.rnd() > chance) return;
  const d = (G.rnd()*4)|0;
  const nx = x+DX[d], ny = y+DY[d];
  const n = get(nx,ny);
  if (n===T.EMPTY || n===T.DIRT){
    G.g[idx(nx,ny)] = T.AMOEBA;
    G.scn[idx(nx,ny)] = 1;
  }
}

/* ================= один шаг игровой логики ================= */
function tick(){
  if (G.state !== 'play') return;

  // ход записывается: (зерно уровня + журнал) полностью воспроизводят партию
  if (G.log) G.log.push((keys.up?1:0)|(keys.right?2:0)|(keys.down?4:0)|(keys.left?8:0)|(keys.grab?16:0));

  playerStep();

  G.scn.fill(0);
  if (G.alive && G.born===0) G.scn[idx(G.px,G.py)] = 1;

  const prevConvert = G.amoebaConvert;
  G.amoebaCount = 0; G.amoebaGrow = false;

  for (let y=1; y<H-1; y++){
    for (let x=1; x<W-1; x++){
      const i = idx(x,y);
      if (G.scn[i]) continue;
      const t = G.g[i];
      switch(t){
        case T.BOULDER: case T.DIAMOND: stepFalling(x,y,t); break;
        case T.FIREFLY: case T.BUTTERFLY: stepBug(x,y,t); break;
        case T.AMOEBA: stepAmoeba(x,y); break;
        case T.EXPAND:
          if (get(x-1,y)===T.EMPTY){ G.g[idx(x-1,y)] = T.EXPAND; G.scn[idx(x-1,y)] = 1; }
          if (get(x+1,y)===T.EMPTY){ G.g[idx(x+1,y)] = T.EXPAND; G.scn[idx(x+1,y)] = 1; }
          break;
        case T.BOOM: case T.BIRTH:
          if (--G.ph[i] <= 0){ G.g[i] = (t===T.BIRTH) ? T.DIAMOND : T.EMPTY; G.fall[i] = 0; }
          break;
      }
    }
  }
  // судьба амёбы
  if (prevConvert){
    G.amoebaConvert = 0;
  } else if (G.amoebaCount > 0){
    if (!G.amoebaGrow) G.amoebaConvert = 1;                                 // заперта — в валуны
    else if (G.amoebaCount > (G.cave.amoebaMax||200)) G.amoebaConvert = 2;  // разрослась — в алмазы
  }
  if (G.amoebaTimer > 0 && --G.amoebaTimer <= 0) G.amoebaFast = true;
  // волшебная стена
  if (G.magicState === 1 && --G.magicTimer <= 0) G.magicState = 2;
  // время
  if (G.alive){
    if (++G.subtick >= Math.round(1000/TICK)){
      G.subtick = 0;
      G.time--;
      if (G.time <= 10 && G.time > 0) SFX.tick();
      if (G.time <= 0){ G.time = 0; killPlayer(true); }
    }
  } else if (G.state === 'play'){
    if (--G.endTimer <= 0) loseLife();
  }
  updateHud();
}

function loseLife(){
  G.score = G.scoreAtStart;              // очки, набранные в погибшей попытке, не засчитываются
  if (G.bonus){ G.state = 'between'; showBonusResult(false); return; }
  G.lives--;
  if (G.lives <= 0){ G.state = 'over'; showGameOver(); }
  else startLevel(G.lvl, false, true);
}
function finishCave(){
  if (G.bonus){ G.lives++; G.state = 'between'; showBonusResult(true); return; }
  const bonus = G.time * 5 * (G.cave.mul || 1);
  G.score += bonus;
  G.state = 'between';
  showBetween(bonus);
}

/* ================= отрисовка ================= */
function draw(){
  const f = (G.frame >> 2) & 3;
  const A = G.atlas;
  if (!A){ return; }

  let vw = VW, vh = VH, cx = G.camx, cy = G.camy, ts = TS;
  if (G.overview){ vw = W; vh = H; cx = 0; cy = 0; ts = Math.floor(640/W); }
  if (cv.width !== vw*ts || cv.height !== vh*ts){ cv.width = vw*ts; cv.height = vh*ts; }
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,cv.width,cv.height);

  for (let y=0; y<vh; y++){
    for (let x=0; x<vw; x++){
      const gx = cx+x, gy = cy+y;
      if (gx>=W||gy>=H) continue;
      const i = idx(gx,gy);
      const t = G.g[i];
      let s = null;
      switch(t){
        case T.EMPTY: continue;
        case T.DIRT: s = A.dirt[0]; break;
        case T.BOULDER: s = A.boulder[0]; break;
        case T.DIAMOND: s = A.diamond[f]; break;
        case T.BRICK: s = A.brick[0]; break;
        case T.STEEL: s = A.steel[0]; break;
        case T.EXIT: s = A.exit[0]; break;
        case T.EXITOPEN: s = A.exitopen[f&1]; break;
        case T.FIREFLY: s = A.firefly[f]; break;
        case T.BUTTERFLY: s = A.butterfly[f]; break;
        case T.AMOEBA: s = A.amoeba[f]; break;
        case T.SLIME: s = A.slime[f]; break;
        case T.EXPAND: s = A.expand[0]; break;
        case T.BOOM: s = A.boom[4-Math.min(4,G.ph[i])]; break;
        case T.BIRTH: s = A.birth[4-Math.min(4,G.ph[i])]; break;
        case T.INBOX: s = A.inbox[(G.frame>>2)&1]; break;
        case T.MAGIC:
          s = G.magicState===1 ? A.magicon[(G.frame>>1)%3] : (G.magicState===2 ? A.magicdead[0] : A.magic[0]);
          break;
        case T.PLAYER: {
          let arr = A.player;
          if (keys.left) arr = A.walkL;
          else if (keys.right) arr = A.walkR;
          s = arr[f % arr.length];
          break;
        }
      }
      if (s) ctx.drawImage(s, x*ts, y*ts, ts, ts);
    }
  }
}
function updateCamera(){
  const mx = 6, my = 3;
  if (G.px - G.camx < mx) G.camx = G.px - mx;
  if (G.px - G.camx > VW-1-mx) G.camx = G.px - (VW-1-mx);
  if (G.py - G.camy < my) G.camy = G.py - my;
  if (G.py - G.camy > VH-1-my) G.camy = G.py - (VH-1-my);
  G.camx = clamp(G.camx,0,W-VW);
  G.camy = clamp(G.camy,0,H-VH);
}

/* ================= таблица рекордов ================= */
let HS = [];
const HS_KEY = 'rockfall:highscores';
async function loadHS(){
  try{
    if (typeof window !== 'undefined' && window.storage){
      const r = await window.storage.get(HS_KEY);
      HS = r && r.value ? JSON.parse(r.value) : [];
    }
  } catch(e){ HS = []; }
}
async function saveHS(){
  try{ if (typeof window !== 'undefined' && window.storage) await window.storage.set(HS_KEY, JSON.stringify(HS)); }
  catch(e){}
}
function hsQualifies(sc){ return sc > 0 && (HS.length < 8 || sc > HS[HS.length-1].score); }
function hsAdd(name, sc, cave){
  HS.push({ name:(name||'ГОСТЬ').trim().slice(0,8).toUpperCase() || 'ГОСТЬ', score:sc, cave:cave });
  HS.sort((a,b)=> b.score - a.score);
  HS = HS.slice(0,8);
  saveHS();
}
function hsHtml(){
  if (!HS.length) return '<p class="hint">Рекордов пока нет.</p>';
  return '<table class="hs">' + HS.map((r,i)=>
    `<tr><td>${i+1}</td><td>${r.name}</td><td>${r.score}</td><td>${r.cave}</td></tr>`).join('') + '</table>';
}
function scoreForm(title, sub){
  showOverlay(`
    <p class="big">${title}</p>
    <p>${sub}</p>
    <p>${t('gotScore')}: <b style="color:#fff">${G.score}</b> · ${t('reached')} <b style="color:#fff">${G.cave.num}</b></p>
    <p>${t('yourName')}</p>
    <p><input id="nm" maxlength="8" autocomplete="off">
       <button class="play" id="sv" style="font-size:14px;padding:8px 16px">${t('saveBtn')}</button></p>
    <p class="hint desk-only">${t('enterKey')}</p>
  `);
  const inp = document.getElementById('nm');
  const sv = document.getElementById('sv');
  if (sv) sv.addEventListener('click', ()=>{ hsAdd(inp.value, G.score, G.cave.num); showMenu(); });
  if (!TOUCH) inp.focus();
  inp.addEventListener('keydown', e=>{
    e.stopPropagation();
    if (e.key === 'Enter'){ hsAdd(inp.value, G.score, G.cave.num); showMenu(); }
  });
}

/* ================= интерфейс ================= */
function updateHud(){
  const set = (id,v)=>{ const e = document.getElementById(id); if (e) e.textContent = v; };
  set('l-lvl', t('lvl')); set('l-dia', t('dia')); set('l-time', t('time'));
  set('l-score', t('score')); set('l-lives', t('lives'));
  set('f-keys', t('foot'));
  set('h-lvl', G.cave ? (G.bonus ? '★ ' + G.cave.num : G.cave.num + '/' + TOTAL) : '-');
  set('h-dia', G.bonus ? String(G.got) : (G.got + '/' + G.need));
  set('h-time', G.time);
  set('h-score', G.score);
  set('h-lives', G.lives);
  set('f-name', G.cave ? (G.bonus ? t('bonusName')
        : t('cave') + ' ' + G.cave.id + ' «' + G.cave.name + '» · ' + t('ring') + ' ' + (G.cave.ring+1)) : '');
  const dia = document.getElementById('h-dia');
  if (dia) dia.style.color = G.exitOpen ? '#40f040' : '#fff';
}
function showOverlay(html){ panel.innerHTML = html; overlay.style.display = 'flex'; }
function wireNext(fn){
  const b = document.getElementById('nx');
  if (b) b.addEventListener('click', ()=>{ ac(); fn(); });
}
function hideOverlay(){ overlay.style.display = 'none'; }

function showMenu(){
  G.state = 'menu';
  const langBtns = Object.keys(I18N).map(k=>
    `<button class="lang ${k===LANG?'on':''}" data-l="${k}">${I18N[k].lab}</button>`).join('');
  showOverlay(`
    <div class="langs">${langBtns}</div>
    <h1>ROCKFALL</h1>
    <div class="cols">
      <div>
        <p>${t('intro')}</p>
        ${TOUCH ? `<div class="keys">
          <i>&#9650; &#9664; &#9654; &#9660;</i><span>${t('kMove')}</span>
          <i>GRAB</i><span>${t('kGrab')}</span>
          <i>MAP</i><span>${t('kMap')}</span>
          <i>II</i><span>${t('kPause')}</span>
        </div>` : `<div class="keys">
          <i>&#8592; &#8593; &#8594; &#8595; / WASD</i><span>${t('kMove')}</span>
          <i>Shift + &#8594;</i><span>${t('kGrab')}</span>
          <i>ESC</i><span>${t('kPause')}</span>
          <i>R</i><span>${t('kRestart')}</span>
          <i>TAB</i><span>${t('kMap')}</span>
        </div>`}
        <p><button class="play" id="go">${t('play')}</button></p>
        <p class="hint">${t('hint')}</p>
      </div>
      <div>
        <p style="margin:0 0 6px;color:#f0d000;font-size:13px">${t('records')}</p>
        ${hsHtml()}
      </div>
    </div>
  `);
  const go = document.getElementById('go');
  if (go) go.addEventListener('click', ()=>{ ac(); startLevel(0, false, false); });
  panel.querySelectorAll('.lang').forEach(b=>{
    b.addEventListener('click', ()=>{ LANG = b.dataset.l; showMenu(); updateHud(); });
  });
}
function showBetween(bonus){
  const nextIsBonus = (G.lvl+1) % 8 === 0 && G.lvl+1 < TOTAL;
  showOverlay(`
    <p class="big">${t('done')}</p>
    <p>${t('tbonus')}: <b style="color:#fff">${bonus}</b></p>
    <p>${t('total')}: <b style="color:#fff">${G.score}</b></p>
    ${nextIsBonus ? `<p style="color:#f0d000">${t('bonusIntro')}</p><p class="hint">${t('bonusRules')}</p>` : ''}
    <p><button class="play" id="nx">${t('nextBtn')}</button></p>
    <p class="hint desk-only">${t('next')}</p>
  `);
  wireNext(advance);
}
function showBonusResult(won){
  showOverlay(`
    <p class="big">${won ? t('bonusWin') : t('bonusLose')}</p>
    <p>${t('lives')}: <b style="color:#fff">${G.lives}</b></p>
    <p>${t('total')}: <b style="color:#fff">${G.score}</b></p>
    <p><button class="play" id="nx">${t('nextBtn')}</button></p>
    <p class="hint desk-only">${t('next')}</p>
  `);
  wireNext(advance);
}
function showGameOver(){
  if (hsQualifies(G.score)){ scoreForm(t('over'), t('overSub')); return; }
  showOverlay(`
    <p class="big">${t('over')}</p>
    <p>${t('gotScore')}: <b style="color:#fff">${G.score}</b></p>
    <p><button class="play" id="nx">${t('menuBtn')}</button></p>
    <p class="hint desk-only">${t('toMenu')}</p>
  `);
  wireNext(showMenu);
}
function showVictory(){
  if (hsQualifies(G.score)){ scoreForm(t('win'), t('winSub')); return; }
  showOverlay(`
    <p class="big">${t('win')}</p>
    <p>${t('gotScore')}: <b style="color:#fff">${G.score}</b></p>
    <p><button class="play" id="nx">${t('menuBtn')}</button></p>
    <p class="hint desk-only">${t('toMenu')}</p>
  `);
  wireNext(showMenu);
}
function showPause(){
  showOverlay(`
    <p class="big">${t('paused')}</p>
    <p class="hint">${t('pauseKeys')}</p>
  `);
}

/* ================= главный цикл ================= */
let acc = 0, last = 0;
function loop(t){
  requestAnimationFrame(loop);
  if (!last) last = t;
  const dt = Math.min(t-last, 250); last = t;
  G.frame++;
  if (G.state === 'play'){
    acc += dt;
    while (acc >= TICK){ acc -= TICK; tick(); }
    updateCamera();
    draw();
  } else if (G.state === 'won'){
    if (--G.endTimer <= 0) finishCave();
    draw();
  } else if (G.g){
    draw();
  }
}

/* ================= ввод ================= */
function togglePause(){
  if (G.state==='play'){ G.state='paused'; showPause(); }
  else if (G.state==='paused'){ G.state='play'; hideOverlay(); }
}

// сенсорный джойстик: держим кнопку — держится направление
function bindTouch(){
  try{
    TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  } catch(e){ TOUCH = false; }
  if (!TOUCH) return;
  document.body.classList.add('touch');
  const btns = document.querySelectorAll('#pad .k');
  for (let i=0;i<btns.length;i++){
    const b = btns[i], k = b.dataset.k;
    const press = e=>{
      e.preventDefault(); ac();
      b.classList.add('down');
      if (k==='pause'){ togglePause(); return; }
      if (k==='map'){ G.overview = true; return; }
      keys[k] = true;
    };
    const release = e=>{
      if (e) e.preventDefault();
      b.classList.remove('down');
      if (k==='map'){ G.overview = false; return; }
      if (k!=='pause') keys[k] = false;
    };
    b.addEventListener('pointerdown', press);
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('pointerleave', release);
    b.addEventListener('contextmenu', e=>e.preventDefault());
  }
  // палец мог уйти со всех кнопок — не оставляем направление зажатым
  addEventListener('pointerup', ()=>{
    keys.up = keys.down = keys.left = keys.right = keys.grab = false;
    const d = document.querySelectorAll('#pad .k.down');
    for (let i=0;i<d.length;i++) d[i].classList.remove('down');
  });
}
function bindKeys(){
  const map = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right'
  };
  addEventListener('keydown', e=>{
    const ae = document.activeElement;
    if (ae && ae.tagName === 'INPUT') return;
    if (map[e.code]){ keys[map[e.code]] = true; e.preventDefault(); }
    if (e.code==='ShiftLeft'||e.code==='ShiftRight') keys.grab = true;
    if (e.code==='Tab'){ G.overview = true; e.preventDefault(); }
    if (e.code==='Escape') togglePause();
    if (e.code==='KeyR' && (G.state==='play'||G.state==='paused')){
      if (G.state==='paused'){ G.state='play'; hideOverlay(); }
      killPlayer(true);                       // перезапуск стоит жизни — иначе очки можно фармить
    }
    if (e.code==='KeyM' && G.state!=='play') showMenu();
    if (e.code==='Space'){
      e.preventDefault();
      if (G.state==='between') advance();
      else if (G.state==='over') showMenu();
    }
    ac();
  });
  addEventListener('keyup', e=>{
    if (map[e.code]) keys[map[e.code]] = false;
    if (e.code==='ShiftLeft'||e.code==='ShiftRight') keys.grab = false;
    if (e.code==='Tab') G.overview = false;
  });
  addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });
}

function init(){
  cv = document.getElementById('cv');
  ctx = cv.getContext('2d');
  panel = document.getElementById('panel');
  overlay = document.getElementById('overlay');
  bindKeys();
  bindTouch();
  showMenu();
  updateHud();
  loadHS().then(()=>{ if (G.state === 'menu') showMenu(); });
  requestAnimationFrame(loop);
}
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('load', init);
