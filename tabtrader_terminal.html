<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TabTrader Terminal — мониторинг криптовалют</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* ========================================================================
   ТОКЕНЫ ТЁМНОЙ ТЕМЫ
   ======================================================================== */
:root{
  --bg:#131722; --panel:#1e222d; --panel2:#262b3a; --line:#2a2e39;
  --text:#d1d4dc; --dim:#787b86; --up:#26a69a; --down:#ef5350; --accent:#2962ff;
  --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-size:13px;
  font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  display:flex; flex-direction:column;
  height:100vh; height:100dvh;           /* dvh — иначе на мобильных низ уезжает под панель браузера */
  overflow:hidden; -webkit-user-select:none; user-select:none;
}
button,input,select{font:inherit;font-size:12px;color:var(--text);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--panel2)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input{cursor:text;-webkit-user-select:text;user-select:text}
svg{display:block}

/* ================================ ШАПКА ================================ */
.topbar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none}
.brand{font-family:var(--mono);letter-spacing:.12em;font-size:13px}
.brand b{color:var(--accent);font-weight:600}
.spacer{flex:1}
.conn{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--up)} .dot.err{background:var(--down)}

/* =============================== ВКЛАДКИ =============================== */
.tabbar{display:flex;gap:2px;padding:0 10px;background:var(--bg);
  border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:8px;padding:8px 12px;background:none;border:none;
  border-radius:0;border-bottom:2px solid transparent;color:var(--dim);white-space:nowrap;touch-action:manipulation}
.tab:hover{background:var(--panel);color:var(--text)}
.tab.active{background:var(--panel);color:var(--text);border-bottom-color:var(--accent)}
.tab .x{font-size:14px;line-height:1;color:var(--dim);padding:0 2px;border-radius:3px}
.tab .x:hover{color:var(--down)}
.tab input{padding:2px 6px;width:120px;font-size:12px;border-radius:4px}
.tab-add{border:none;background:none;color:var(--dim);font-size:16px;padding:6px 11px}
.tab-add:hover{color:var(--text);background:none}

/* ============================ СПИСОК ПЛИТОК ============================ */
.watchlist{flex:none;max-height:46vh;overflow-y:auto;padding:12px;border-bottom:1px solid var(--line)}
body.no-chart .watchlist{max-height:none;flex:1}
.wl-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.wl-head h2{font-size:12px;font-weight:600;color:var(--dim)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:5px 9px;background:var(--panel)}
.seg button.on{background:var(--accent);color:#fff}
.wl-add{display:flex;gap:6px}
.wl-add input{width:160px;text-transform:uppercase}
.wl-add[hidden]{display:none}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.grid.c1{grid-template-columns:1fr}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.card{position:relative;overflow:hidden;background:#1e222d;border:1px solid var(--line);border-radius:8px;
  padding:10px 12px 14px;min-height:96px;display:flex;flex-direction:column;gap:6px;cursor:pointer;
  transition:border-color .15s,background .15s}
.card:hover{background:#232734;border-color:#3a4050}
.card.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;position:relative;z-index:2}
.card .pair{font-family:var(--mono);font-size:12.5px}
.card .chg{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.card .price{position:relative;z-index:2;font-family:var(--mono);font-size:21px;
  font-variant-numeric:tabular-nums;transition:color .4s}
.price.fu{color:var(--up)} .price.fd{color:var(--down)}
.card .venue{position:relative;z-index:2;font-size:10px;color:var(--dim);letter-spacing:.08em}
.card .spark{position:absolute;left:0;right:0;bottom:0;height:46px;z-index:1;opacity:.5}
.card .kill{position:absolute;top:4px;right:4px;z-index:3;background:none;border:none;color:var(--dim);
  font-size:13px;line-height:1;padding:3px 5px;border-radius:4px;opacity:0}
.card:hover .kill{opacity:1}
.card .kill:hover{color:var(--down);background:rgba(0,0,0,.35)}
.grid.c1 .card{flex-direction:row;align-items:center;gap:14px;min-height:0;padding:10px 12px}
.grid.c1 .card .row{flex:1;justify-content:flex-start;gap:10px}
.grid.c1 .card .price{font-size:17px;margin-left:auto;padding-right:26px}
.grid.c1 .card .venue{display:none}
.grid.c1 .card .spark{left:auto;right:130px;width:110px;height:100%;opacity:.45}
.card.add{align-items:center;justify-content:center;background:none;border:1px dashed #3a4050;
  color:var(--dim);font-size:12px;gap:4px}
.card.add:hover{color:var(--text);border-color:var(--accent);background:none}
.card.add .plus{font-size:20px;line-height:1}

/* ============================== ГРАФИК ================================ */
.chart-panel{flex:1;display:flex;flex-direction:column;min-height:0}
body.no-chart .chart-panel{display:none}
/* Полноэкранный режим: остаётся только панель графика */
body.full .topbar, body.full .tabbar, body.full .watchlist, body.full .statusbar{display:none}
body.full .chart-panel{flex:1}

.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.toolbar .symbol{font-family:var(--mono);font-size:15px}
.toolbar .last{font-family:var(--mono);font-size:12px;color:var(--dim)}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.ico{display:flex;align-items:center;justify-content:center;width:30px;height:28px;padding:0;flex:none}
.ico.on{background:rgba(41,98,255,.22);border-color:var(--accent);color:#8aa8ff}
.ico:disabled{opacity:.35;cursor:default}
.tf{display:flex;gap:2px;flex-wrap:wrap}
.tf button{padding:5px 8px;background:none;border-color:transparent;color:var(--dim);font-family:var(--mono)}
.tf button:hover{background:var(--panel2);color:var(--text)}
.tf button.on{background:var(--panel2);color:var(--text);border-color:var(--line)}

.color-wrap{position:relative}
.swatch-btn i{display:block;width:15px;height:15px;border-radius:4px;border:1px solid rgba(0,0,0,.4)}
.palette{position:absolute;top:34px;left:0;z-index:60;display:grid;grid-template-columns:repeat(4,26px);
  gap:6px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 22px rgba(0,0,0,.55)}
.palette[hidden]{display:none}
.palette button{width:26px;height:26px;padding:0;border-radius:5px;border:1px solid rgba(0,0,0,.4)}

/* Зона графика. min-height гарантирует, что ось времени не схлопнется на телефоне */
.chart-wrap{position:relative;flex:1;min-height:260px;touch-action:none}
#chart{position:absolute;inset:0}
/* Слой разметки: размер всегда синхронизирован с реальным пикселным размером
   графика (см. plotW/plotH в JS) — так линии никогда не обрезаются и не «уезжают». */
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.legend{position:absolute;top:8px;left:10px;z-index:5;font-family:var(--mono);font-size:11px;
  color:var(--dim);pointer-events:none;line-height:1.5;text-shadow:0 1px 3px #000}
.legend b{color:var(--text);font-weight:500}
.overlay{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--dim);text-align:center;padding:24px}
.overlay[hidden]{display:none}

/* ============================ СТАТУС-БАР ============================== */
.statusbar{display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--panel);
  border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
.statusbar .msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusbar .msg.err{color:var(--down)}
.statusbar .msg.ok{color:var(--up)}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2f3542;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

@media(max-width:700px){
  .watchlist{max-height:34vh;padding:10px}          /* оставляем графику больше места */
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .grid.c4{grid-template-columns:repeat(2,1fr)}
  .toolbar{padding:5px 8px;gap:5px}
  .toolbar .last{display:none}
  .statusbar #lastUpdate{display:none}
  .chart-wrap{min-height:230px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><b>TAB</b>TRADER</div>
  <div class="spacer"></div>
  <div class="conn"><span class="dot" id="connDot"></span><span id="connText">подключение…</span></div>
</header>

<nav class="tabbar" id="tabbar"></nav>

<section class="watchlist">
  <div class="wl-head">
    <h2>Список наблюдения</h2>
    <div class="seg" id="colsSeg" title="Плиток в ряду">
      <button data-cols="1">1</button><button data-cols="2">2</button><button data-cols="4">4</button>
    </div>
    <button id="toggleChart" title="Скрыть или показать основной график">Скрыть график</button>
    <span class="spacer"></span>
    <form class="wl-add" id="addForm" hidden>
      <input id="pairInput" placeholder="fil · filusdc · fil/usdc" maxlength="24" spellcheck="false" autocomplete="off">
      <button type="submit">Добавить</button>
      <button type="button" id="cancelAdd">Отмена</button>
    </form>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section class="chart-panel">
  <div class="toolbar">
    <span class="symbol" id="symbolLabel">—</span>
    <span class="last" id="lastLabel"></span>
    <span class="sep"></span>
    <div class="tf" id="tfBar"></div>
    <span class="sep"></span>

    <button class="ico" id="modeH" title="Горизонтальная линия по всей ширине графика: нажмите, затем кликните (H)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M1 8h14"/><circle cx="5.5" cy="8" r="1.7" fill="currentColor" stroke="none"/></svg></button>
    <button class="ico" id="modeV" title="Вертикальная линия на всю высоту графика: нажмите, затем кликните (V)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M8 1v14"/><circle cx="8" cy="5.5" r="1.7" fill="currentColor" stroke="none"/></svg></button>
    <span class="color-wrap">
      <button class="ico swatch-btn" id="colorBtn" title="Цвет линии"><i id="swatch"></i></button>
      <div class="palette" id="palette" hidden></div>
    </span>
    <button class="ico" id="delBtn" title="Удалить выделенную линию (Delete)" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 4h10M6.5 4V2.5h3V4M5 4l.7 9h4.6L11 4"/></svg></button>

    <span class="sep"></span>
    <button class="ico" id="fitBtn" title="Вписать график">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M2 5.5V2h3.5M14 5.5V2h-3.5M2 10.5V14h3.5M14 10.5V14h-3.5"/></svg></button>
    <button class="ico" id="histBtn" title="Догрузить всю историю">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8 3.5v4.7l3 1.9"/><path d="M2.7 6.4A5.6 5.6 0 1 1 2.5 9"/><path d="M1 5.4l1.7 1.3L4.4 5.2"/></svg></button>
    <button class="ico" id="fullBtn" title="Во весь экран (F)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"/></svg></button>
    <span class="spacer"></span>
    <span class="last" id="modeHint">Рисование выключено</span>
  </div>

  <div class="chart-wrap" id="wrap">
    <div id="chart"></div>
    <svg id="lines"></svg>
    <div class="legend" id="legend"></div>
    <div class="overlay" id="overlay">Добавьте пару в список наблюдения</div>
  </div>
</section>

<footer class="statusbar">
  <span class="msg" id="statusMsg">Загрузка…</span>
  <span id="lastUpdate">обновлено: —</span>
  <span>Binance · 1 c</span>
</footer>

<script>
/* =========================================================================
   МОДЕЛЬ ДАННЫХ (полностью сохраняется в localStorage)
   tabs:[{ id,name,pairs[],active,interval,cols,chartHidden,full,
           marks:{ SYMBOL:{ h:[{id,price,color}], v:[{id,time,color}] } } }]
   ========================================================================= */
const API = 'https://api.binance.com/api/v3';
const KEY = 'tabtrader.terminal.v4';
const PRICE_TICK_MS = 1000;     // цены и последняя свеча — раз в секунду
const WINDOW_TICK_MS = 15000;   // спарклайны плиток — раз в 15 секунд

const TF = {
  '1m':{label:'1м',base:'1m',group:1},   '5m':{label:'5м',base:'5m',group:1},
  '15m':{label:'15м',base:'15m',group:1},'1h':{label:'1ч',base:'1h',group:1},
  '4h':{label:'4ч',base:'4h',group:1},   '1d':{label:'1д',base:'1d',group:1},
  '4d':{label:'4д',base:'1d',group:4},   '1M':{label:'1М',base:'1M',group:1},
  '1y':{label:'1Г',base:'1M',group:12}
};

const Store = {
  mem:null,
  ok(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch{ return false; } },
  load(k){ if(this.ok()){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } } return this.mem; },
  save(k,v){ const d=JSON.stringify(v); if(this.ok()){ try{ localStorage.setItem(k,d); return; }catch{} } this.mem=JSON.parse(d); }
};
const defaults = () => ({ activeTabId:'t1', tabs:[{ id:'t1',name:'Основной',
  pairs:['BTCUSDT','ETHUSDT','SOLUSDT'], active:'BTCUSDT', interval:'1h',
  cols:2, chartHidden:false, full:false, marks:{} }] });

let state = Store.load(KEY) || defaults();
state.tabs.forEach(t=>{ t.cols??=2; t.chartHidden??=false; t.full??=false; t.marks??={}; });

let prices={}, windows={}, info=new Map();
let rawBars=[], bars=[];
let chart, candles, volumes;
let drawMode=null, selected=null, color='#f0b90b', dragging=null;
let loadingOlder=false, hasOlder=true, chartToken=0;
let plotW=0, plotH=0;   // фактический пиксельный размер графика — источник правды для слоя линий
const FUTURE_OFFSET = 45;   // «пустых» свечей справа — место, где ещё нет цены, для линий на будущее

const uid = () => Math.random().toString(36).slice(2,9);
const save = () => Store.save(KEY,state);
const tab = () => state.tabs.find(t=>t.id===state.activeTabId) ?? state.tabs[0];
const marksOf = s => { const t=tab(); t.marks[s]??={h:[],v:[]}; return t.marks[s]; };
const $ = id => document.getElementById(id);

/* =========================================================================
   ФОРМАТ ЦЕН: всегда минимум 2 знака, разделитель — точка
   ========================================================================= */
function money(v){
  const n = Number(v);
  if(!isFinite(n)) return '—';
  let d = 2;
  if(Math.abs(n) > 0 && Math.abs(n) < 1){
    const exp = Math.floor(Math.log10(Math.abs(n)));    // мелкие монеты — больше знаков
    d = Math.min(8, Math.max(2, -exp + 3));
  }
  const [i,f] = n.toFixed(d).split('.');
  return i.replace(/\B(?=(\d{3})+(?!\d))/g,' ') + '.' + f;
}
const pct = v => (v>0?'+':'') + Number(v).toFixed(2) + '%';
const pretty = s => { const i=info.get(s); return i ? `${i.base}/${i.quote}` : s.replace(/(USDT|USDC|FDUSD|TUSD|BTC|ETH|BNB|EUR|TRY)$/,'/$1'); };
const dtf = (t,o) => new Date(t*1000).toLocaleString('ru-RU',o);
const setStatus = (t,cls='') => { const e=$('statusMsg'); e.textContent=t; e.className='msg '+cls; };
const setConn = (ok,t) => { $('connDot').className='dot '+(ok?'ok':'err'); $('connText').textContent=t; };

/* =========================================================================
   СПРАВОЧНИК СИМВОЛОВ
   ========================================================================= */
async function loadExchangeInfo(){
  const c = Store.load(KEY+'.symbols');
  if(c && Date.now()-c.ts < 864e5){ c.list.forEach(([s,b,q])=>info.set(s,{base:b,quote:q})); return; }
  try{
    const d = await (await fetch(`${API}/exchangeInfo?permissions=SPOT`)).json();
    const list = d.symbols.filter(s=>s.status==='TRADING').map(s=>[s.symbol,s.baseAsset,s.quoteAsset]);
    list.forEach(([s,b,q])=>info.set(s,{base:b,quote:q}));
    Store.save(KEY+'.symbols',{ts:Date.now(),list});
  }catch{}
}
function resolveSymbol(input){
  const raw = input.trim().toUpperCase();
  if(raw.includes('/')){
    const [b,q] = raw.split('/').map(x=>x.replace(/[^A-Z0-9]/g,''));
    return b&&q ? b+q : null;
  }
  const clean = raw.replace(/[^A-Z0-9]/g,'');
  if(!clean) return null;
  if(info.size){
    if(info.has(clean)) return clean;
    if(info.has(clean+'USDT')) return clean+'USDT';
    return null;
  }
  return /USDT|USDC|BTC$/.test(clean) ? clean : clean+'USDT';
}

/* =========================================================================
   ВКЛАДКИ (долгое нажатие → переименование)
   ========================================================================= */
function renderTabs(){
  const bar = $('tabbar'); bar.replaceChildren();
  for(const t of state.tabs){
    const b = document.createElement('button');
    b.className = 'tab' + (t.id===state.activeTabId?' active':'');
    b.title = 'Долгое нажатие или двойной клик — переименовать';
    b.append(Object.assign(document.createElement('span'),{textContent:t.name}));
    if(state.tabs.length>1){
      const x = Object.assign(document.createElement('span'),{className:'x',textContent:'×',title:'Закрыть'});
      x.onclick = e => { e.stopPropagation(); closeTab(t.id); };
      b.append(x);
    }
    let timer=null, long=false;
    const start = () => { long=false; timer=setTimeout(()=>{ long=true; editTab(t.id,b); },550); };
    const stop  = () => clearTimeout(timer);
    b.addEventListener('pointerdown',start);
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener('contextmenu',e=>{ e.preventDefault(); editTab(t.id,b); });
    b.onclick = () => { if(!long) switchTab(t.id); };
    b.ondblclick = () => editTab(t.id,b);
    bar.append(b);
  }
  const add = Object.assign(document.createElement('button'),{className:'tab-add',textContent:'+',title:'Новая вкладка'});
  add.onclick = newTab; bar.append(add);
}
function editTab(id, btn){
  const t = state.tabs.find(x=>x.id===id);
  if(btn.querySelector('input')) return;
  btn.replaceChildren();
  const inp = Object.assign(document.createElement('input'),{value:t.name,maxLength:24});
  btn.append(inp); inp.focus(); inp.select();
  const commit = ok => { if(ok && inp.value.trim()) t.name = inp.value.trim(); save(); renderTabs(); };
  inp.onclick = e => e.stopPropagation();
  inp.onblur = () => commit(true);
  inp.onkeydown = e => { e.stopPropagation();
    if(e.key==='Enter'){ inp.onblur=null; commit(true); }
    if(e.key==='Escape'){ inp.onblur=null; commit(false); } };
}
function switchTab(id){ state.activeTabId=id; save(); applyTabView(); renderAll(); loadChart(); loadWindows(); }
function newTab(){
  const t = { id:uid(), name:`Вкладка ${state.tabs.length+1}`, pairs:[], active:null,
              interval:'1h', cols:2, chartHidden:false, full:false, marks:{} };
  state.tabs.push(t); state.activeTabId=t.id; save(); applyTabView(); renderAll(); loadChart();
}
function closeTab(id){
  const t = state.tabs.find(x=>x.id===id);
  if(!confirm(`Закрыть вкладку «${t.name}»?`)) return;
  state.tabs = state.tabs.filter(x=>x.id!==id);
  if(state.activeTabId===id) state.activeTabId = state.tabs[0].id;
  save(); applyTabView(); renderAll(); loadChart(); loadWindows();
}

/* =========================================================================
   ПЛИТКИ
   ========================================================================= */
function sparkSvg(points,col){
  if(!points||points.length<2) return '';
  const min=Math.min(...points),max=Math.max(...points),span=(max-min)||1,w=100,h=30;
  const p = points.map((v,i)=>`${(i/(points.length-1)*w).toFixed(2)},${(h-(v-min)/span*h).toFixed(2)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${p}" fill="none" stroke="${col}" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <polyline points="0,${h} ${p} ${w},${h}" fill="${col}" opacity=".12" stroke="none"/></svg>`;
}
function changeOf(sym){
  const w=windows[sym], p=prices[sym];
  if(!w||!w.open||!isFinite(p)) return null;
  return (p-w.open)/w.open*100;
}
function renderGrid(){
  const t=tab(), grid=$('grid');
  grid.className='grid c'+t.cols; grid.replaceChildren();
  for(const sym of t.pairs){
    const ch=changeOf(sym);
    const dir = ch==null?'':ch>=0?'up':'down';
    const col = ch==null?'#787b86':ch>=0?'#26a69a':'#ef5350';
    const card=document.createElement('div');
    card.className='card'+(sym===t.active?' active':''); card.tabIndex=0;
    card.innerHTML = `${sparkSvg(windows[sym]?.points,col)}
      <div class="row"><span class="pair">${pretty(sym)}</span>
      <span class="chg ${dir}" id="c-${sym}">${ch==null?'—':pct(ch)+(ch>=0?' ▲':' ▼')}</span></div>
      <div class="price" id="p-${sym}">${prices[sym]!=null?money(prices[sym]):'…'}</div>
      <div class="venue">BINANCE · ${TF[t.interval].label}</div>
      <button class="kill" title="Убрать пару">×</button>`;
    const pick = () => {
      if(t.chartHidden){ t.chartHidden=false; save(); applyTabView(); }
      if(t.active!==sym){ t.active=sym; save(); renderGrid(); loadChart(); }
    };
    card.onclick=pick;
    card.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } };
    card.querySelector('.kill').onclick=e=>{ e.stopPropagation(); removePair(sym); };
    grid.append(card);
  }
  const add=document.createElement('div');
  add.className='card add'; add.tabIndex=0;
  add.innerHTML=`<span class="plus">+</span><span>Добавить пару</span>`;
  const open=()=>{ $('addForm').hidden=false; $('pairInput').focus(); };
  add.onclick=open; add.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); open(); } };
  grid.append(add);
}
async function addPair(input){
  const t=tab(), sym=resolveSymbol(input);
  if(!sym){ setStatus(`Пара не найдена: «${input}». Попробуйте FIL, FILUSDC или FIL/USDC.`,'err'); return; }
  if(t.pairs.includes(sym)){ setStatus(`${pretty(sym)} уже в списке`); return; }
  setStatus(`Проверяем ${sym}…`);
  try{
    const r = await fetch(`${API}/ticker/price?symbol=${sym}`);
    if(!r.ok) throw 0;
    prices[sym]=parseFloat((await r.json()).price);
  }catch{
    setStatus(`Пара ${sym} не торгуется на Binance. Укажите котируемую валюту явно, например ${sym.replace(/USDT$/,'')}/USDC.`,'err');
    return;
  }
  t.pairs.push(sym); t.active ??= sym;
  $('pairInput').value=''; $('addForm').hidden=true;
  save(); renderGrid(); loadWindows();
  if(t.pairs.length===1) loadChart();
  setStatus(`${pretty(sym)} добавлена`,'ok');
}
function removePair(sym){
  const t=tab();
  t.pairs=t.pairs.filter(p=>p!==sym); delete t.marks[sym];
  if(t.active===sym) t.active=t.pairs[0]??null;
  save(); renderGrid(); loadChart();
}

/* =========================================================================
   СВЕЧИ, АГРЕГАЦИЯ, ИСТОРИЯ
   ========================================================================= */
async function getKlines(symbol,base,limit,endTime){
  let url=`${API}/klines?symbol=${symbol}&interval=${base}&limit=${limit}`;
  if(endTime) url+=`&endTime=${endTime}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
function aggregate(raw,key){
  const cfg=TF[key];
  const one=raw.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
  if(cfg.group===1) return one;
  const keyOf=c => key==='1y' ? new Date(c.time*1000).getUTCFullYear() : Math.floor(c.time/(86400*cfg.group));
  const out=[]; let cur=null,ck=null;
  for(const c of one){
    const k=keyOf(c);
    if(k!==ck){ if(cur) out.push(cur); cur={...c}; ck=k; }
    else{ cur.high=Math.max(cur.high,c.high); cur.low=Math.min(cur.low,c.low); cur.close=c.close; cur.volume+=c.volume; }
  }
  if(cur) out.push(cur);
  return out;
}
function pushToChart(){
  bars=aggregate(rawBars,tab().interval);
  candles.setData(bars);
  volumes.setData(bars.map(b=>({time:b.time,value:b.volume,
    color:b.close>=b.open?'rgba(38,166,154,.35)':'rgba(239,83,80,.35)'})));
}
async function loadChart(){
  const t=tab(), token=++chartToken;
  renderTF();
  if(!t.active){
    $('symbolLabel').textContent='—'; $('lastLabel').textContent='';
    rawBars=[]; bars=[]; candles.setData([]); volumes.setData([]);
    $('overlay').hidden=false; $('overlay').textContent='Добавьте пару в список наблюдения';
    return;
  }
  $('symbolLabel').textContent=pretty(t.active);
  $('overlay').hidden=false;
  $('overlay').textContent=`Загружаем ${pretty(t.active)} · ${TF[t.interval].label}…`;
  hasOlder=true; select(null);
  try{
    const raw=await getKlines(t.active,TF[t.interval].base,1000);
    if(token!==chartToken) return;
    rawBars=raw; pushToChart(); fitView(); refreshPriceAutoscale();
    $('overlay').hidden=true;
    setConn(true,'Binance: онлайн');
    setStatus(`${pretty(t.active)} · ${TF[t.interval].label} · свечей: ${bars.length}`);
  }catch(e){
    $('overlay').hidden=false;
    $('overlay').textContent='Свечи не загрузились. Проверьте соединение.';
    setConn(false,'Binance: ошибка');
    setStatus('Ошибка графика: '+e.message,'err');
  }
}
async function loadOlder(){
  const t=tab();
  if(loadingOlder||!hasOlder||!rawBars.length||!t.active) return;
  loadingOlder=true;
  const token=chartToken;
  try{
    const raw=await getKlines(t.active,TF[t.interval].base,1000,rawBars[0][0]-1);
    if(token!==chartToken) return;
    if(!raw.length){ hasOlder=false; setStatus('Загружена вся доступная история'); return; }
    const range=chart.timeScale().getVisibleLogicalRange();
    const before=bars.length;
    rawBars=raw.concat(rawBars); pushToChart();
    if(range){
      const shift=bars.length-before;
      chart.timeScale().setVisibleLogicalRange({from:range.from+shift,to:range.to+shift});
    }
    setStatus(`История: ${bars.length} свечей с ${dtf(bars[0].time,{day:'2-digit',month:'2-digit',year:'numeric'})}`);
  }catch(e){ setStatus('История не догрузилась: '+e.message,'err'); }
  finally{ loadingOlder=false; }
}
async function loadAllHistory(){
  setStatus('Загружаем историю с самого начала…');
  for(let i=0;i<40 && hasOlder;i++){
    const before=rawBars.length;
    await loadOlder();
    if(rawBars.length===before) break;
  }
  chart.timeScale().fitContent();
  setStatus(`Загружено ${bars.length} свечей с ${bars.length?dtf(bars[0].time,{day:'2-digit',month:'2-digit',year:'numeric'}):'—'}`,'ok');
}

/* =========================================================================
   ГРАФИК
   ========================================================================= */
const MON=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function tickFormatter(time,type){
  const key=tab().interval, d=new Date(time*1000), p=n=>String(n).padStart(2,'0');
  if(key==='1y') return String(d.getFullYear());
  if(key==='1M') return `${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;
  if(key==='1d'||key==='4d') return type<=1 ? `${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`
                                            : `${p(d.getDate())}.${p(d.getMonth()+1)}`;
  return type<=2 ? `${p(d.getDate())}.${p(d.getMonth()+1)}` : `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function initChart(){
  chart = LightweightCharts.createChart($('chart'),{
    layout:{background:{color:'#131722'},textColor:'#9aa0ad',fontFamily:'ui-monospace, monospace',fontSize:11},
    grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},
    rightPriceScale:{borderColor:'#2a2e39',scaleMargins:{top:.1,bottom:.24}},
    timeScale:{borderColor:'#2a2e39',visible:true,timeVisible:true,secondsVisible:false,
      rightOffset:FUTURE_OFFSET,barSpacing:9,minBarSpacing:.3,ticksVisible:true,
      tickMarkFormatter:(t,type)=>tickFormatter(t,type)},
    localization:{locale:'ru-RU', priceFormatter:v=>money(v),
      timeFormatter:t=>dtf(t,{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal,
      vertLine:{color:'#4a5162',labelBackgroundColor:'#2a2e39'},
      horzLine:{color:'#4a5162',labelBackgroundColor:'#2a2e39'}}
  });
  candles = chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',
    borderUpColor:'#26a69a',borderDownColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350',
    /* Расширяем автомасштаб по вертикали так, чтобы нарисованные горизонтальные
       линии всегда попадали в видимую область цены, даже если они выше или ниже
       всех свечей на экране (например, ценовая цель в будущем). */
    autoscaleInfoProvider: original => {
      const res = original();
      const sym = tab().active;
      if(!res || !sym) return res;
      const hMarks = marksOf(sym).h;
      if(!hMarks.length) return res;
      let min = res.priceRange.minValue, max = res.priceRange.maxValue;
      for(const m of hMarks){ if(m.price<min) min=m.price; if(m.price>max) max=m.price; }
      return { priceRange:{ minValue:min, maxValue:max }, margins: res.margins };
    }
  });
  volumes = chart.addHistogramSeries({priceScaleId:'',scaleMargins:{top:.86,bottom:0},
    priceFormat:{type:'custom',formatter:v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':v.toFixed(0)}});

  chart.subscribeCrosshairMove(param=>{
    const l=$('legend');
    const c=param.seriesData?.get(candles);
    if(!param.time||!c){ l.textContent=''; return; }
    const up=c.close>=c.open;
    l.innerHTML=`${dtf(param.time,{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})} ·
      О <b>${money(c.open)}</b> М <b>${money(c.high)}</b> Н <b>${money(c.low)}</b>
      З <b style="color:${up?'#26a69a':'#ef5350'}">${money(c.close)}</b>`;
  });
  chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{ if(r && r.from<12) loadOlder(); });

  new ResizeObserver(([e])=>{
    if(!e.contentRect.width) return;
    plotW = e.contentRect.width; plotH = e.contentRect.height;
    chart.applyOptions({width:plotW,height:plotH});
  }).observe($('chart'));

  initLineInput();
  requestAnimationFrame(paintLines);
}
function timeAt(x){
  const logical=chart.timeScale().coordinateToLogical(x);
  if(logical==null||!bars.length) return null;
  return bars[Math.min(bars.length-1,Math.max(0,Math.round(logical)))].time;
}
function fitView(){
  if(!bars.length) return;
  const visible=Math.min(bars.length,180);
  chart.timeScale().setVisibleLogicalRange({from:bars.length-visible,to:bars.length+4});
  candles.priceScale().applyOptions({autoScale:true});
}

/* =========================================================================
   РАЗМЕТКА: собственный SVG-слой + свои события указателя
   Логика: включили инструмент → клик по графику ставит линию и инструмент
   выключается. Клик по линии выделяет её и позволяет тянуть.
   Клик по пустому месту снимает выделение.
   ========================================================================= */
const SVGNS='http://www.w3.org/2000/svg';
const HIT=9;                     // радиус попадания по линии, px
let coords=new Map();            // id -> текущая экранная координата (для клика/перетаскивания)

/* Линии рисуются каждый кадр заново — это дёшево (обычно не больше десятка
   штук) и полностью исключает рассинхронизацию размеров, из-за которой
   линии «уезжали» в угол. Размер слоя всегда берётся из plotW/plotH —
   тех же чисел, которыми управляется сам график, а не из CSS-геометрии
   SVG-элемента (она может отставать на первых кадрах). */
function paintLines(){
  requestAnimationFrame(paintLines);
  const svg=$('lines');
  const sym=tab().active;
  const w = plotW || $('chart').clientWidth;
  const h = plotH || $('chart').clientHeight;

  if(!chart||!sym||!bars.length||!w||!h){
    if(svg.childNodes.length) svg.replaceChildren();
    coords.clear();
    return;
  }

  // Жёстко фиксируем пиксельный размер SVG-полотна — гарантия того, что
  // 1 единица координат в разметке равна 1 пикселю графика.
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  const m=marksOf(sym);
  const items=[...m.h.map(x=>({...x,kind:'h'})), ...m.v.map(x=>({...x,kind:'v'}))];
  svg.replaceChildren();
  coords.clear();
  const ts=chart.timeScale();

  for(const it of items){
    const on = selected && selected.id===it.id;
    const g=document.createElementNS(SVGNS,'g');
    const line=document.createElementNS(SVGNS,'line');
    line.setAttribute('stroke',it.color);
    line.setAttribute('stroke-width', on?2.5:1.4);
    line.setAttribute('stroke-dasharray', on?'none':'5 4');
    line.setAttribute('vector-effect','non-scaling-stroke');
    const text=document.createElementNS(SVGNS,'text');
    text.setAttribute('fill',it.color);
    text.setAttribute('font-family','ui-monospace, monospace');
    text.setAttribute('font-size','11');
    text.setAttribute('stroke','#131722');
    text.setAttribute('stroke-width','3.5');
    text.setAttribute('paint-order','stroke');

    if(it.kind==='h'){
      // Горизонтальная линия: от края до края, включая пустую область
      // справа (там ещё нет цены) — это одна прямая на всю ширину графика.
      const y=candles.priceToCoordinate(it.price);
      if(y==null) continue;                   // цена вне видимого диапазона — но autoscale выше держит её внутри
      line.setAttribute('x1',0); line.setAttribute('x2',w);
      line.setAttribute('y1',y); line.setAttribute('y2',y);
      // Подпись всегда у правого края, в «будущей» зоне — рядом со шкалой цены.
      text.setAttribute('text-anchor','end');
      text.setAttribute('x', w-8);
      text.setAttribute('y', y-6);
      text.textContent=money(it.price);
      coords.set(it.id,{kind:'h',y});
    }else{
      // Вертикальная линия: от самого верха до самого низа графика.
      const x=ts.timeToCoordinate(it.time);
      if(x==null) continue;                   // время сейчас не в видимой прокрутке
      line.setAttribute('x1',x); line.setAttribute('x2',x);
      line.setAttribute('y1',0); line.setAttribute('y2',h);
      const nearRight = x > w-72;
      text.setAttribute('text-anchor', nearRight?'end':'start');
      text.setAttribute('x', nearRight ? x-6 : x+6);
      text.setAttribute('y', h-8);            // подпись у нижнего края, рядом со шкалой времени
      text.textContent=dtf(it.time,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      coords.set(it.id,{kind:'v',x});
    }
    g.append(line,text);
    svg.append(g);
  }
}

/* Принудительно пересчитать видимый диапазон цены — вызывается после
   изменения горизонтальных линий, чтобы они сразу попадали в кадр. */
function refreshPriceAutoscale(){
  try{ candles.priceScale().applyOptions({ autoScale:true }); }catch{}
}

function hitTest(x,y){
  for(const [id,c] of coords){
    if(c.kind==='h' && Math.abs(c.y-y)<=HIT) return {id,kind:'h'};
    if(c.kind==='v' && Math.abs(c.x-x)<=HIT) return {id,kind:'v'};
  }
  return null;
}
function findMark(sel){
  if(!sel) return null;
  return marksOf(tab().active)[sel.kind].find(m=>m.id===sel.id) ?? null;
}
function select(sel){ selected=sel; $('delBtn').disabled=!sel; }

/* Перехватываем указатель ДО графика: так линия не конфликтует с панорамой */
function initLineInput(){
  const wrap=$('wrap');

  wrap.addEventListener('pointerdown', e=>{
    const sym=tab().active;
    if(!sym||!bars.length) return;
    const r=$('chart').getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;

    // 1. Режим постановки линии
    if(drawMode){
      if(drawMode==='h'){
        const price=candles.coordinateToPrice(y);
        if(price!=null){
          marksOf(sym).h.push({id:uid(),price:Number(price),color});
          setStatus(`Горизонталь на ${money(price)}`);
          refreshPriceAutoscale();
        }
      }else{
        const time=timeAt(x);
        if(time!=null){
          marksOf(sym).v.push({id:uid(),time,color});
          setStatus(`Вертикаль на ${dtf(time,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}`);
        }
      }
      save(); setMode(null);                 // инструмент выключается сам
      e.preventDefault(); e.stopPropagation();
      return;
    }

    // 2. Попали по существующей линии → выделяем и тянем
    const hit=hitTest(x,y);
    if(hit){
      select(hit);
      dragging=hit;
      wrap.setPointerCapture(e.pointerId);
      e.preventDefault(); e.stopPropagation();
      return;
    }

    // 3. Пустое место → снимаем выделение, дальше событие идёт графику
    select(null);
  }, true);

  wrap.addEventListener('pointermove', e=>{
    const r=$('chart').getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;

    if(dragging){
      const mark=findMark(dragging);
      if(mark){
        if(dragging.kind==='h'){
          const price=candles.coordinateToPrice(y);
          if(price!=null){ mark.price=Number(price); refreshPriceAutoscale(); }
        }else{
          const time=timeAt(x);
          if(time!=null) mark.time=time;
        }
      }
      e.preventDefault(); e.stopPropagation();
      return;
    }
    // Подсказка курсором, что линию можно схватить
    if(!drawMode){
      const h=hitTest(x,y);
      wrap.style.cursor = h ? (h.kind==='h'?'ns-resize':'ew-resize') : '';
    }else{
      wrap.style.cursor='crosshair';
    }
  }, true);

  const stop = e => {
    if(!dragging) return;
    dragging=null; save();
    try{ $('wrap').releasePointerCapture(e.pointerId); }catch{}
    e.stopPropagation();
  };
  wrap.addEventListener('pointerup', stop, true);
  wrap.addEventListener('pointercancel', stop, true);
}

function deleteSelected(){
  if(!selected) return;
  const store=marksOf(tab().active);
  store[selected.kind]=store[selected.kind].filter(m=>m.id!==selected.id);
  select(null); save();
  refreshPriceAutoscale();
  setStatus('Линия удалена');
}

/* Палитра: выбор цвета сразу закрывает меню */
const COLORS=['#f0b90b','#2962ff','#26a69a','#ef5350','#ab47bc','#ff9800','#ffffff','#00bcd4'];
function initPalette(){
  const pal=$('palette');
  COLORS.forEach(c=>{
    const b=document.createElement('button');
    b.style.background=c; b.title=c;
    b.onclick=()=>{
      color=c; $('swatch').style.background=c; pal.hidden=true;
      const m=findMark(selected);
      if(m){ m.color=c; save(); refreshPriceAutoscale(); }
    };
    pal.append(b);
  });
  $('swatch').style.background=color;
  $('colorBtn').onclick=e=>{ e.stopPropagation(); pal.hidden=!pal.hidden; };
  document.addEventListener('click',()=>{ pal.hidden=true; });
}

/* =========================================================================
   ТАЙМФРЕЙМЫ, ОКНА ДЛЯ ПЛИТОК
   ========================================================================= */
function renderTF(){
  const bar=$('tfBar'), t=tab();
  bar.replaceChildren();
  for(const [key,cfg] of Object.entries(TF)){
    const b=document.createElement('button');
    b.textContent=cfg.label; b.className=key===t.interval?'on':'';
    b.onclick=()=>{ t.interval=key; save(); renderTF(); loadChart(); loadWindows(); };
    bar.append(b);
  }
}
async function loadWindows(){
  const t=tab(), cfg=TF[t.interval];
  await Promise.all(t.pairs.map(async sym=>{
    try{
      const raw=await getKlines(sym,cfg.base,Math.min(1000,40*cfg.group));
      const agg=aggregate(raw,t.interval);
      if(agg.length) windows[sym]={open:agg.at(-1).open,points:agg.slice(-40).map(c=>c.close)};
    }catch{}
  }));
  renderGrid();
}

/* =========================================================================
   ОБНОВЛЕНИЕ РАЗ В СЕКУНДУ
   ========================================================================= */
async function tickPrices(){
  const all=[...new Set(state.tabs.flatMap(t=>t.pairs))];
  if(!all.length) return;
  try{
    const r=await fetch(`${API}/ticker/price?symbols=${encodeURIComponent(JSON.stringify(all))}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    for(const d of await r.json()){
      const prev=prices[d.symbol], now=parseFloat(d.price);
      prices[d.symbol]=now;
      const pEl=$(`p-${d.symbol}`);
      if(pEl){
        pEl.textContent=money(now);
        if(prev!=null&&now!==prev){
          pEl.classList.remove('fu','fd');
          pEl.classList.add(now>prev?'fu':'fd');
          setTimeout(()=>pEl.classList.remove('fu','fd'),900);
        }
      }
      const cEl=$(`c-${d.symbol}`);
      if(cEl){
        const ch=changeOf(d.symbol);
        cEl.textContent = ch==null?'—':pct(ch)+(ch>=0?' ▲':' ▼');
        cEl.className='chg '+(ch==null?'':ch>=0?'up':'down');
      }
    }
    const a=tab().active;
    if(a&&prices[a]!=null){
      const ch=changeOf(a);
      $('lastLabel').textContent=`${money(prices[a])}${ch==null?'':'  '+pct(ch)}`;
    }
    setConn(true,'Binance: онлайн');
    $('lastUpdate').textContent='обновлено: '+new Date().toLocaleTimeString('ru-RU');
  }catch{ setConn(false,'Binance: ошибка'); }
}
async function tickCandle(){
  const t=tab();
  if(!t.active||!rawBars.length||t.chartHidden||loadingOlder||dragging) return;
  try{
    const raw=await getKlines(t.active,TF[t.interval].base,2);
    for(const k of raw){
      const i=rawBars.findIndex(b=>b[0]===k[0]);
      if(i>=0) rawBars[i]=k; else rawBars.push(k);
    }
    const last=aggregate(rawBars.slice(-TF[t.interval].group*2),t.interval).at(-1);
    if(last){
      candles.update(last);
      volumes.update({time:last.time,value:last.volume,
        color:last.close>=last.open?'rgba(38,166,154,.35)':'rgba(239,83,80,.35)'});
      bars[bars.length-1]=last;
    }
  }catch{}
}

/* =========================================================================
   ВИД: колонки, скрытый график, полный экран
   ========================================================================= */
function applyTabView(){
  const t=tab();
  document.body.classList.toggle('no-chart',t.chartHidden && !t.full);
  document.body.classList.toggle('full',t.full);
  $('toggleChart').textContent = t.chartHidden?'Показать график':'Скрыть график';
  for(const b of $('colsSeg').children) b.classList.toggle('on',+b.dataset.cols===t.cols);
  $('fullBtn').classList.toggle('on',t.full);
  if(chart) setTimeout(fitView,60);
}
function toggleFull(){
  const t=tab();
  t.full=!t.full;
  if(t.full) t.chartHidden=false;
  save(); applyTabView();
  // Пробуем ещё и настоящий полноэкранный режим браузера
  if(t.full) document.documentElement.requestFullscreen?.().catch(()=>{});
  else if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
}
document.addEventListener('fullscreenchange',()=>{
  const t=tab();
  if(!document.fullscreenElement && t.full){ t.full=false; save(); applyTabView(); }
});

/* =========================================================================
   ОБРАБОТЧИКИ
   ========================================================================= */
$('addForm').onsubmit=e=>{ e.preventDefault(); addPair($('pairInput').value); };
$('cancelAdd').onclick=()=>{ $('addForm').hidden=true; };
$('toggleChart').onclick=()=>{ const t=tab(); t.chartHidden=!t.chartHidden; save(); applyTabView(); };
$('colsSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  tab().cols=+b.dataset.cols; save(); applyTabView(); renderGrid();
};
$('fitBtn').onclick=fitView;
$('histBtn').onclick=loadAllHistory;
$('delBtn').onclick=deleteSelected;
$('fullBtn').onclick=toggleFull;

function setMode(mode){
  drawMode = drawMode===mode ? null : mode;
  $('modeH').classList.toggle('on',drawMode==='h');
  $('modeV').classList.toggle('on',drawMode==='v');
  $('modeHint').textContent =
    drawMode==='h' ? 'Кликните по графику — встанет горизонталь' :
    drawMode==='v' ? 'Кликните по графику — встанет вертикаль'  :
    'Линию можно схватить и передвинуть';
  $('wrap').style.cursor = drawMode?'crosshair':'';
}
$('modeH').onclick=()=>setMode('h');
$('modeV').onclick=()=>setMode('v');

document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  const k=e.key.toLowerCase();
  if(k==='h') setMode('h');
  if(k==='v') setMode('v');
  if(k==='f') toggleFull();
  if((e.key==='Delete'||e.key==='Backspace') && selected){ e.preventDefault(); deleteSelected(); }
  if(e.key==='Escape'){
    if(drawMode) setMode(drawMode);
    else if(tab().full) toggleFull();
    select(null); $('palette').hidden=true;
  }
});

/* =========================================================================
   СТАРТ
   ========================================================================= */
function renderAll(){ renderTabs(); renderGrid(); renderTF(); }

(async function boot(){
  initChart(); initPalette(); setMode(null); applyTabView(); renderAll();
  await loadExchangeInfo();
  renderGrid();
  await Promise.all([loadChart(),loadWindows(),tickPrices()]);
  setInterval(()=>{ tickPrices(); tickCandle(); },PRICE_TICK_MS);
  setInterval(loadWindows,WINDOW_TICK_MS);
  setStatus(Store.ok()
    ? 'Готово. Вкладки, плитки, таймфреймы и разметка сохраняются автоматически.'
    : 'localStorage заблокирован — настройки сохранятся только до перезагрузки.', Store.ok()?'':'err');
})();
</script>
