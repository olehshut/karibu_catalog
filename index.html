<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Souvenirs Catalog</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --accent: #3498db;
            --accent-dark: #2980b9;
            --danger: #e74c3c;
            --border: #e1e8ed;
            --radius: 12px;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --transition: 0.2s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            flex: 1;
            min-width: 180px;
        }
        .search-wrapper {
            flex: 2;
            min-width: 180px;
            position: relative;
        }
        .search-wrapper input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 30px;
            font-size: 1rem;
            background: var(--card-bg);
            transition: border var(--transition);
            outline: none;
        }
        .search-wrapper input:focus { border-color: var(--accent); }
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 30px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn:hover { background: #eaeef2; transform: translateY(-1px); }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-dark); }
        .lang-switch {
            display: inline-flex;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            background: var(--card-bg);
        }
        .lang-switch button {
            padding: 8px 14px;
            border: none;
            background: transparent;
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
        }
        .lang-switch button.active { background: var(--accent); color: white; }
        .lang-switch button:hover:not(.active) { background: #eaeef2; }
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform var(--transition), box-shadow var(--transition);
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .card-photo {
            width: 100%;
            height: 200px;
            background-color: #eef2f5;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            position: relative;
        }
        .card-photo.placeholder::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%23808c96' stroke-width='4'%3E%3Crect x='2' y='2' width='96' height='96' rx='6'/%3E%3Cpath d='M2 2 98 98M98 2 2 98'/%3E%3C/g%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 68px 68px;
            opacity: 0.32;
        }
        .card-photo-count {
            position: absolute;
            bottom: 8px; right: 8px;
            background: rgba(0,0,0,0.65);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            pointer-events: none;
        }
        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
            word-break: break-word;
        }
        .card-price {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-dark);
        }
        .card-price-usd {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-light);
            margin-top: -4px;
        }
        .card-meta {
            font-size: 0.9rem;
            color: var(--text-light);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-desc {
            font-size: 0.9rem;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }
        .card-date {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: flex-end;
        }
        .card-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .edit-btn { background: #f0f4f8; color: var(--text); }
        .edit-btn:hover { background: #e2e8f0; }
        .delete-btn { background: #fef2f2; color: var(--danger); }
        .delete-btn:hover { background: #fde8e8; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.hidden { display: none; }
        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-close {
            position: absolute;
            top: 12px; right: 16px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-light);
            line-height: 1;
            padding: 4px 8px;
            border-radius: 50%;
            transition: background var(--transition);
        }
        .modal-close:hover { background: #f0f0f0; }
        .modal-content h2 { margin-bottom: 20px; font-size: 1.5rem; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: #fafbfc;
            transition: border var(--transition);
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            background: white;
        }
        .form-group input[readonly] {
            background: #f0f4f8;
            color: var(--text-light);
            cursor: default;
        }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1;
            min-width: 140px;
        }
        .dimensions-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .dimensions-row input {
            flex: 1;
            min-width: 72px;
            font-size: 0.95rem;
            text-align: center;
        }
        .dimensions-row input::placeholder { color: var(--text-light); opacity: 1; }
        .photo-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .photo-actions .btn {
            flex: 1;
            min-width: 120px;
            justify-content: center;
            padding: 10px 14px;
            font-size: 0.9rem;
        }
        .photo-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .photo-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .photo-thumb-wrapper {
            position: relative;
            display: inline-block;
        }
        .photo-remove {
            position: absolute;
            top: -6px; right: -6px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px; height: 22px;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }
        .settings-info {
            background: #f0f7ff;
            border: 1px solid #d0e6f7;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text);
        }
        .settings-info strong { color: var(--accent-dark); }
        .rate-source {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 4px;
        }
        .lightbox {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            user-select: none;
            -webkit-user-select: none;
        }
        .lightbox.hidden { display: none; }
        .lightbox-inner {
            position: relative;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox img {
            max-width: 92%;
            max-height: 72%;
            object-fit: contain;
            border-radius: 8px;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }
        .lightbox-close {
            position: absolute;
            top: 16px; right: 20px;
            font-size: 2.8rem;
            color: white;
            cursor: pointer;
            z-index: 2010;
            line-height: 1;
            background: rgba(0,0,0,0.3);
            width: 48px; height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .lightbox-close:hover { background: rgba(255,255,255,0.15); }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            width: 48px; height: 48px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 2010;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            backdrop-filter: blur(4px);
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.3); }
        .lightbox-nav.prev { left: 16px; }
        .lightbox-nav.next { right: 16px; }
        .lightbox-nav.hidden { display: none; }
        .lightbox-counter {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.55);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            z-index: 2010;
            letter-spacing: 0.5px;
        }
        .lightbox-thumbs {
            position: absolute;
            left: 0; right: 0;
            bottom: 0;
            padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
            overflow-x: auto;
            overflow-y: hidden;
            z-index: 2010;
            background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .lightbox-thumbs::-webkit-scrollbar { display: none; }
        .lightbox-thumbs-inner {
            display: flex;
            gap: 8px;
            width: max-content;
            margin: 0 auto;
        }
        .lightbox-thumbs img {
            width: 62px; height: 62px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid transparent;
            opacity: 0.5;
            cursor: pointer;
            flex: none;
            max-width: none;
            max-height: none;
            pointer-events: auto;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .lightbox-thumbs img.active { opacity: 1; border-color: #fff; }
        .lightbox-thumbs.hidden { display: none; }
        /* --- view modes --- */
        .catalog.view-large { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .catalog.view-two   { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .catalog.view-four  { grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .catalog.view-two .card-photo  { height: 160px; }
        .catalog.view-two .card-desc   { -webkit-line-clamp: 2; }
        .catalog.view-four .card-photo { height: 110px; }
        .catalog.view-four .card-photo.placeholder::before { background-size: 40px 40px; }
        .catalog.view-two .card-photo.placeholder::before { background-size: 56px 56px; }
        .catalog.view-four .card-body  { padding: 10px; gap: 4px; }
        .catalog.view-four .card-title { font-size: 0.95rem; }
        .catalog.view-four .card-price { font-size: 1rem; }
        .catalog.view-four .card-desc,
        .catalog.view-four .card-date,
        .catalog.view-four .card-meta  { display: none; }
        .catalog.view-four .card-actions button { padding: 5px 8px; font-size: 0.8rem; }
        .catalog.view-list { display: flex; flex-direction: column; gap: 8px; }

        .list-row {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .list-row-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .list-row-head:hover { background: #f7f9fb; }
        .list-thumb {
            width: 52px; height: 52px;
            flex: none;
            border-radius: 8px;
            background-color: #eef2f5;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .list-thumb.placeholder::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%23808c96' stroke-width='4'%3E%3Crect x='2' y='2' width='96' height='96' rx='6'/%3E%3Cpath d='M2 2 98 98M98 2 2 98'/%3E%3C/g%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 34px 34px;
            opacity: 0.32;
        }
        .list-main { flex: 1; min-width: 0; }
        .list-title {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-sub { font-size: 0.85rem; color: var(--text-light); }
        .list-sub b { color: var(--accent-dark); font-weight: 700; }
        .list-arrow { color: var(--text-light); font-size: 1rem; transition: transform var(--transition); }
        .list-row.open .list-arrow { transform: rotate(180deg); }
        .list-body {
            padding: 0 12px 12px 12px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .list-body.hidden { display: none; }
        .list-photos { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 12px; }
        .list-photos img {
            width: 72px; height: 72px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        /* --- autosave indicator --- */
        .save-state {
            font-size: 0.85rem;
            color: #27ae60;
            min-height: 20px;
            margin-bottom: 12px;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .save-state.on { opacity: 1; }

        /* --- export history --- */
        .export-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .export-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fafbfc;
            font-size: 0.88rem;
        }
        .export-row .ex-main { flex: 1; min-width: 0; }
        .export-row .ex-name { font-weight: 600; word-break: break-all; }
        .export-row .ex-meta { color: var(--text-light); font-size: 0.8rem; }
        .export-row button { padding: 6px 12px; font-size: 0.85rem; }
        .export-empty { color: var(--text-light); font-size: 0.88rem; margin-top: 8px; }

        @media (max-width: 600px) {
            .catalog.view-four { grid-template-columns: repeat(4, 1fr); gap: 6px; }
            .catalog.view-four .card-photo { height: 72px; }
            .catalog.view-four .card-body { padding: 6px; }
            .catalog.view-four .card-title { font-size: 0.78rem; }
            .catalog.view-four .card-price { font-size: 0.8rem; }
            .catalog.view-four .card-price-usd { font-size: 0.7rem; }
            .catalog.view-four .card-actions { gap: 4px; margin-top: 6px; }
            .catalog.view-four .card-actions button { padding: 4px 6px; font-size: 0.72rem; }

            body { padding: 8px; }
            header { gap: 8px; }
            h1 { font-size: 1.4rem; }
            .btn { padding: 8px 14px; font-size: 0.85rem; }
            .modal-content { padding: 16px; margin: 8px; }
            .catalog { gap: 12px; }
            .lang-switch button { padding: 6px 10px; font-size: 0.85rem; }
            .lightbox-nav { width: 40px; height: 40px; font-size: 1.5rem; }
            .lightbox-nav.prev { left: 8px; }
            .lightbox-nav.next { right: 8px; }
            .lightbox-close { top: 10px; right: 10px; width: 42px; height: 42px; font-size: 2.2rem; }
            .lightbox-thumbs img { width: 52px; height: 52px; }
            .lightbox img { max-height: 66%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="app-title">📦 Souvenirs</h1>
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="Search by name or description...">
            </div>
            <div class="toolbar">
                <div class="lang-switch" id="lang-switch">
                    <button type="button" data-lang="en" class="active">EN</button>
                    <button type="button" data-lang="ru">RU</button>
                </div>
                <button class="btn" id="view-btn" title="View">▦</button>
                <button class="btn" id="settings-btn" title="Settings">⚙️</button>
                <button class="btn" id="export-btn" title="Export catalog as archive">📤 Export</button>
                <button class="btn" id="import-btn" title="Import catalog from archive">📥 Import</button>
                <button class="btn btn-primary" id="add-btn">➕ Add item</button>
                <input type="file" id="import-file" accept=".zip,.json,application/zip,application/json" style="display: none;">
            </div>
        </header>
        <main>
            <div id="catalog" class="catalog"></div>
            <div id="empty-state" style="text-align:center; padding: 40px; color: var(--text-light); display: none;">
                <p style="font-size: 2rem; margin-bottom: 8px;">📭</p>
                <p id="empty-text">No items yet. Add the first one!</p>
            </div>
        </main>
    </div>

    <!-- Form modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">×</button>
            <h2 id="modal-title">New item</h2>
            <div class="save-state" id="save-state"></div>
            <form id="item-form">
                <div class="form-group">
                    <label for="f-name" id="label-name">Name *</label>
                    <input type="text" id="f-name" required placeholder="Souvenir name">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="f-price" id="label-price">Price (GMD) *</label>
                        <input type="number" id="f-price" step="0.01" min="0" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="f-price-usd" id="label-price-usd">≈ USD (auto)</label>
                        <input type="text" id="f-price-usd" readonly placeholder="—">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="f-weight" id="label-weight">Weight (g)</label>
                        <input type="number" id="f-weight" step="1" min="0" placeholder="e.g. 500">
                    </div>
                    <div class="form-group">
                        <label for="f-weight-kg" id="label-weight-kg">≈ kg (auto)</label>
                        <input type="text" id="f-weight-kg" readonly placeholder="—">
                    </div>
                </div>
                <div class="form-group">
                    <label id="label-dimensions">Dimensions (cm)</label>
                    <div class="dimensions-row">
                        <input type="number" id="f-length" step="0.1" min="0" placeholder="Length">
                        <input type="number" id="f-width" step="0.1" min="0" placeholder="Width">
                        <input type="number" id="f-height" step="0.1" min="0" placeholder="Height">
                    </div>
                </div>
                <div class="form-group">

            async function fetchRateFromApi() {

                    'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/gmd.min.json'
                ];
                for (const url of urls) {
                    try {
                        const res = await fetch(url, { cache: 'no-store' });
                        if (!res.ok) continue;
                        const data = await res.json();
                        let rate = null;
                        if (data.rates && data.rates.USD) rate = data.rates.USD;
                        else if (data.gmd && data.gmd.usd) rate = data.gmd.usd;
                        if (rate && rate > 0) {
                            saveRate(rate, 'api');
                            return true;
                        }
                    } catch (e) {
                        console.warn('Rate fetch failed:', url, e);
                    }
                }
                return false;
            }

            const DB_NAME = 'SouvenirsCatalog';
            const STORE_NAME = 'items';
            const EXPORT_STORE = 'exports';
            const EXPORT_KEEP = 2;
            let db = null;
            let exportsAvailable = false;

            function createStores(target) {
                if (!target.objectStoreNames.contains(STORE_NAME)) {
                    const store = target.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    store.createIndex('name', 'name', { unique: false });
                    store.createIndex('description', 'description', { unique: false });
                }
                if (!target.objectStoreNames.contains(EXPORT_STORE)) {
                    target.createObjectStore(EXPORT_STORE, { keyPath: 'id' });
                }
            }
            function attach(instance) {
                db = instance;
                exportsAvailable = db.objectStoreNames.contains(EXPORT_STORE);
                db.onversionchange = () => { try { db.close(); } catch (e) {} db = null; };
                return db;
            }
            /* Opens the catalog without demanding a fixed version, so an older or
               newer database on the device can never leave the app without storage. */
            function openDB() {
                return new Promise((resolve, reject) => {
                    let settled = false;
                    const finish = (value) => { if (!settled) { settled = true; resolve(value); } };
                    const fail = (err) => { if (!settled) { settled = true; reject(err || new Error('IndexedDB unavailable')); } };
                    let first;
                    try { first = indexedDB.open(DB_NAME); } catch (e) { return fail(e); }
                    first.onerror = () => fail(first.error);
                    first.onblocked = () => fail(new Error('database is open in another tab'));
                    first.onupgradeneeded = (event) => createStores(event.target.result);
                    first.onsuccess = () => {
                        const inst = first.result;
                        if (inst.objectStoreNames.contains(STORE_NAME) && inst.objectStoreNames.contains(EXPORT_STORE)) {
                            return finish(attach(inst));
                        }
                        const nextVersion = inst.version + 1;
                        try { inst.close(); } catch (e) {}
                        let upgrade;
                        try { upgrade = indexedDB.open(DB_NAME, nextVersion); } catch (e) { return fail(e); }
                        upgrade.onupgradeneeded = (event) => createStores(event.target.result);
                        upgrade.onsuccess = () => finish(attach(upgrade.result));
                        const fallback = () => {
                            /* upgrade refused (another tab, quota, private mode):
                               reopen as-is so the catalog keeps working without export history */
                            const plain = indexedDB.open(DB_NAME);
                            plain.onsuccess = () => finish(attach(plain.result));
                            plain.onerror = () => fail(plain.error);
                        };
                        upgrade.onerror = fallback;
                        upgrade.onblocked = fallback;
                    };
                });
            }
            /* every read/write goes through this, so a closed or missing handle reconnects */
            async function ensureDB() {
                if (db) return db;
                return await openDB();
            }

            async function getAllItems() {
                await ensureDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([STORE_NAME], 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.getAll();
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result || []);
                });
            }

            async function putItem(item) {

                    const tx = db.transaction([STORE_NAME], 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.put(item);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                });
            }

                    const request = store.delete(id);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                });
            }

            function compressImage(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const maxDim = 1920;
                            let width = img.width, height = img.height;
                            if (width > height && width > maxDim) {
                                height = Math.round(height * maxDim / width);
                                width = maxDim;
                            } else if (height > maxDim) {
                                width = Math.round(width * maxDim / height);
                                height = maxDim;
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.8));
                        };
                        img.onerror = () => reject(new Error('Image load error'));
                        img.src = e.target.result;
                    };
                    reader.onerror = () => reject(new Error('File read error'));
                    reader.readAsDataURL(file);
                });
            }

            const VIEW_LABEL = { large: 'viewLarge', two: 'viewTwo', four: 'viewFour', list: 'viewList' };
            let currentView = localStorage.getItem('souvenirs_view') || 'large';
            if (VIEW_ORDER.indexOf(currentView) === -1) currentView = 'large';

            function updateViewButton() {
                if (!viewBtn) return;
                viewBtn.textContent = VIEW_ICON[currentView];
                viewBtn.title = t('viewLabel') + t(VIEW_LABEL[currentView]);
            }

            function renderCatalog(items) {
                catalogEl.innerHTML = '';
                catalogEl.className = 'catalog view-' + currentView;
                if (!items || items.length === 0) {
                    emptyStateEl.style.display = 'block';
                    catalogEl.style.display = 'none';
                    return;
                }
                emptyStateEl.style.display = 'none';
                catalogEl.style.display = (currentView === 'list') ? 'flex' : 'grid';
                items.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
                items.forEach(item => catalogEl.appendChild(
                    currentView === 'list' ? createListRow(item) : createCard(item)
                ));
            }

            function itemMetaText(item) {
                const parts = [];
                if (item.weight) {
                    const g = parseFloat(String(item.weight).replace(',', '.'));
                    parts.push(t('weightIcon') + (isFinite(g) ? g + t('gramsShort') : item.weight));
                }
                const dims = [];
                if (item.dimensions) {
                    if (item.dimensions.length) dims.push(t('lengthShort') + item.dimensions.length);
                    if (item.dimensions.width) dims.push(t('widthShort') + item.dimensions.width);
                    if (item.dimensions.height) dims.push(t('heightShort') + item.dimensions.height);
                }
                if (dims.length) parts.push(t('dimsIcon') + dims.join(' \u00D7 ') + t('dimsUnit'));
                if (item.materials) parts.push(t('materialsIcon') + item.materials);
                return parts;
            }

            function makeActions(item) {
                const actions = document.createElement('div');
                actions.className = 'card-actions';
                const editBtn = document.createElement('button');
                editBtn.className = 'edit-btn';
                editBtn.innerHTML = t('edit');
                editBtn.addEventListener('click', (e) => { e.stopPropagation(); openEditForm(item); });
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = t('delete');
                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (confirm(t('confirmDelete'))) {
                        try {
                            await deleteItemFromDB(item.id);
                            await refreshCatalog();
                        } catch (err) { alert(t('deleteError') + err.message); }
                    }
                });
                actions.appendChild(editBtn);
                actions.appendChild(deleteBtn);
                return actions;
            }

                const photos = (item.photos && item.photos.length) ? item.photos : [];
                const row = document.createElement('div');
                row.className = 'list-row';
                row.dataset.id = item.id;

                const head = document.createElement('div');
                head.className = 'list-row-head';
                const thumb = document.createElement('div');
                thumb.className = 'list-thumb' + (photos.length ? '' : ' placeholder');
                if (photos.length) thumb.style.backgroundImage = `url('${photos[0]}')`;
                thumb.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (photos.length) openLightbox(photos, 0);
                });
                const main = document.createElement('div');
                main.className = 'list-main';
                const title = document.createElement('div');
                title.className = 'list-title';
                title.textContent = item.name || t('noName');
                const sub = document.createElement('div');
                sub.className = 'list-sub';
                const usdVal = gmdToUsd(item.price);
                sub.innerHTML = '<b>' + (item.price != null ? parseFloat(item.price).toFixed(2) + t('currency') : t('priceNotSet')) + '</b>'
                    + (usdVal != null ? ' \u00B7 \u2248 ' + formatUsd(usdVal) : '')
                    + (photos.length > 1 ? ' \u00B7 ' + photos.length + t('photosCount') : '');
                main.appendChild(title);
                main.appendChild(sub);
                const arrow = document.createElement('span');
                arrow.className = 'list-arrow';
                arrow.textContent = '\u25BE';
                head.appendChild(thumb);
                head.appendChild(main);
                head.appendChild(arrow);

                const body = document.createElement('div');
                body.className = 'list-body hidden';
                if (photos.length) {
                    const strip = document.createElement('div');
                    strip.className = 'list-photos';
                    photos.forEach((src, i) => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.alt = t('photoAlt') + (i + 1);
                        img.addEventListener('click', (e) => { e.stopPropagation(); openLightbox(photos, i); });
                        strip.appendChild(img);
                    });
                    body.appendChild(strip);
                }
                const metaParts = itemMetaText(item);
                if (metaParts.length) {
                    const meta = document.createElement('div');
                    meta.className = 'card-meta';
                    meta.style.paddingTop = photos.length ? '0' : '12px';
                    metaParts.forEach(txt => {
                        const sp = document.createElement('span');
                        sp.textContent = txt;
                        meta.appendChild(sp);
                    });
                    body.appendChild(meta);
                }
                if (item.description) {
                    const desc = document.createElement('div');
                    desc.style.fontSize = '0.9rem';
                    desc.style.whiteSpace = 'pre-wrap';
                    desc.textContent = item.description;
                    body.appendChild(desc);
                }
                const dateDiv = document.createElement('div');
                dateDiv.className = 'card-date';
                dateDiv.textContent = t('added') + formatDate(item.dateAdded);
                body.appendChild(dateDiv);
                body.appendChild(makeActions(item));

                head.addEventListener('click', () => {
                    const isOpen = row.classList.contains('open');
                    catalogEl.querySelectorAll('.list-row.open').forEach(r => {
                        r.classList.remove('open');
                        const b = r.querySelector('.list-body');
                        if (b) b.classList.add('hidden');
                    });
                    if (!isOpen) {
                        row.classList.add('open');
                        body.classList.remove('hidden');
                    }
                });

                row.appendChild(head);
                row.appendChild(body);
                return row;
            }

            function createCard(item) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = item.id;
                const photoDiv = document.createElement('div');
                const photos = (item.photos && item.photos.length) ? item.photos : [];
                if (photos.length > 0 && photos[0]) {
                    photoDiv.className = 'card-photo';
                    photoDiv.style.backgroundImage = `url('${photos[0]}')`;
                    if (photos.length > 1) {
                        const countBadge = document.createElement('div');

                        photoDiv.appendChild(countBadge);
                    }
                } else {
                    photoDiv.className = 'card-photo placeholder';
                }
                photoDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (photos.length > 0) openLightbox(photos, 0);
                });
                const body = document.createElement('div');
                body.className = 'card-body';
                const title = document.createElement('h3');
                title.className = 'card-title';
                title.textContent = item.name || t('noName');
                body.appendChild(title);
                const price = document.createElement('div');
                price.className = 'card-price';
                price.textContent = item.price != null ? parseFloat(item.price).toFixed(2) + t('currency') : t('priceNotSet');
                body.appendChild(price);
                const priceUsd = document.createElement('div');
                priceUsd.className = 'card-price-usd';

                priceUsd.textContent = usdVal != null ? '≈ ' + formatUsd(usdVal) : '';
                body.appendChild(priceUsd);
                const meta = document.createElement('div');
                meta.className = 'card-meta';
                itemMetaText(item).forEach(txt => {
                    const sp = document.createElement('span');
                    sp.textContent = txt;
                    meta.appendChild(sp);

                    desc.className = 'card-desc';
                    desc.textContent = item.description;

                dateDiv.className = 'card-date';
                dateDiv.textContent = t('added') + formatDate(item.dateAdded);
                body.appendChild(dateDiv);
                body.appendChild(makeActions(item));

            function refreshCatalog() {
                return getAllItems().then(items => {
                    allItems = items;
                    applySearch();
                }).catch(err => {
                    console.error('Catalog load error:', err);
                    alert(t('loadError') + err.message);
                });
            }

            function applySearch() {
                const query = searchInput.value.trim().toLowerCase();
                if (!query) {
                    renderCatalog(allItems);
                    return;
                }
                const filtered = allItems.filter(item => {
                    const name = (item.name || '').toLowerCase();
                    const desc = (item.description || '').toLowerCase();
                    return name.includes(query) || desc.includes(query);
                });
                renderCatalog(filtered);
            }

            function updateFormUsdPreview() {
                const val = parseFloat(fPrice.value);
                fPriceUsd.value = (val >= 0 && !isNaN(val)) ? formatUsd(gmdToUsd(val)) : '';
            }

            function updateFormKgPreview() {
                const g = parseFloat(fWeight.value);
                fWeightKg.value = (g >= 0 && !isNaN(g)) ? (g / 1000).toFixed(3) + t('kgShort') : '';
            }

            fPrice.addEventListener('input', updateFormUsdPreview);
            fWeight.addEventListener('input', updateFormKgPreview);

            let saveStateTimer = null;
            function showSaveState(text, sticky) {
                if (!saveState) return;
                saveState.textContent = text;
                saveState.classList.add('on');
                clearTimeout(saveStateTimer);
                if (!sticky) saveStateTimer = setTimeout(() => saveState.classList.remove('on'), 1800);
            }

            function formHasContent() {
                if (tempPhotos.length) return true;
                return [fName, fPrice, fWeight, fLength, fWidth, fHeight, fMaterials, fDescription]
                    .some(el => String(el.value).trim() !== '');
            }

            function collectFormItem() {
                const g = parseFloat(fWeight.value);
                const price = parseFloat(fPrice.value);
                const base = editingItem ? Object.assign({}, editingItem) : {};
                return Object.assign(base, {
                    id: editingItem ? editingItem.id : generateId(),
                    name: fName.value.trim(),
                    price: (!isNaN(price) && price >= 0) ? price : null,
                    weight: (!isNaN(g) && g > 0) ? String(g) : '',
                    dimensions: {
                        length: fLength.value ? parseFloat(fLength.value) : 0,
                        width: fWidth.value ? parseFloat(fWidth.value) : 0,
                        height: fHeight.value ? parseFloat(fHeight.value) : 0
                    },
                    materials: fMaterials.value.trim(),
                    description: fDescription.value.trim(),
                    dateAdded: (editingItem && editingItem.dateAdded) ? editingItem.dateAdded : new Date().toISOString(),
                    photos: tempPhotos.slice()
                });
            }

            let autoSaveBusy = false;
            async function autoSave() {
                if (modalOverlay.classList.contains('hidden')) return;
                /* an item is stored as soon as anything at all is filled in:
                   no photo and partial data are perfectly fine */
                if (!editingItem && !formHasContent()) return;
                if (autoSaveBusy) return;
                autoSaveBusy = true;
                try {
                    const item = collectFormItem();
                    showSaveState(t('saving'), true);
                    await putItem(item);
                    editingItem = item;
                    modalTitle.textContent = t('modalEdit');
                    showSaveState(t('saved'));
                    await refreshCatalog();
                } catch (err) {
                    showSaveState(t('saveError') + err.message, true);
                } finally {
                    autoSaveBusy = false;
                }
            }

            [fName, fPrice, fWeight, fLength, fWidth, fHeight, fMaterials, fDescription].forEach(el => {
                el.addEventListener('change', autoSave);
                el.addEventListener('blur', autoSave);
            });
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') autoSave();
            });
            window.addEventListener('pagehide', () => { autoSave(); });

            function openAddForm() {
                editingItem = null;
                tempPhotos = [];
                modalTitle.textContent = t('modalNew');
                fName.value = '';
                fPrice.value = '';
                fPriceUsd.value = '';
                fWeight.value = '';
                fWeightKg.value = '';
                fLength.value = '';
                fWidth.value = '';
                fHeight.value = '';
                fMaterials.value = '';
                fDescription.value = '';
                fPhotosGallery.value = '';
                fPhotosCamera.value = '';
                if (saveState) { saveState.textContent = ''; saveState.classList.remove('on'); }
                updatePhotoPreview();
                modalOverlay.classList.remove('hidden');
                fName.focus();
            }

            function openEditForm(item) {
                editingItem = item;
                tempPhotos = Array.isArray(item.photos) ? [...item.photos] : [];
                modalTitle.textContent = t('modalEdit');
                fName.value = item.name || '';
                fPrice.value = item.price || '';
                updateFormUsdPreview();
                fWeight.value = item.weight ? (parseFloat(item.weight) || '') : '';
                updateFormKgPreview();
                fLength.value = item.dimensions?.length || '';
                fWidth.value = item.dimensions?.width || '';
                fHeight.value = item.dimensions?.height || '';
                fMaterials.value = item.materials || '';
                fDescription.value = item.description || '';
                if (saveState) { saveState.textContent = ''; saveState.classList.remove('on'); }
                fPhotosGallery.value = '';
                fPhotosCamera.value = '';
                updatePhotoPreview();
                modalOverlay.classList.remove('hidden');
            }

            async function closeForm() {
                await autoSave();
                modalOverlay.classList.add('hidden');
                editingItem = null;
                tempPhotos = [];
                if (saveState) { saveState.textContent = ''; saveState.classList.remove('on'); }
            }

            function updatePhotoPreview() {
                photoPreview.innerHTML = '';
                tempPhotos.forEach((photo, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'photo-thumb-wrapper';
                    const img = document.createElement('img');
                    img.className = 'photo-thumb';
                    img.src = photo;
                    img.alt = t('photoAlt') + (index + 1);
                    img.addEventListener('click', () => openLightbox(tempPhotos, index));
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'photo-remove';
                    removeBtn.innerHTML = '×';
                    removeBtn.type = 'button';
                    removeBtn.addEventListener('click', () => {
                        tempPhotos.splice(index, 1);
                        updatePhotoPreview();
                        autoSave();
                    });
                    wrapper.appendChild(img);
                    wrapper.appendChild(removeBtn);
                    photoPreview.appendChild(wrapper);
                });
            }

            async function handlePhotoFiles(files) {
                if (!files || files.length === 0) return;
                try {
                    for (const file of files) {
                        tempPhotos.push(await compressImage(file));
                    }
                    updatePhotoPreview();
                    await autoSave();
                } catch (err) {
                    alert(t('imageError') + err.message);
                }
            }

            btnGallery.addEventListener('click', () => fPhotosGallery.click());
            btnCamera.addEventListener('click', () => fPhotosCamera.click());
            fPhotosGallery.addEventListener('change', async (e) => {
                await handlePhotoFiles(Array.from(e.target.files));
                fPhotosGallery.value = '';
            });
            fPhotosCamera.addEventListener('change', async (e) => {
                await handlePhotoFiles(Array.from(e.target.files));
                fPhotosCamera.value = '';
            });

            itemForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                await closeForm();
            });

            function openSettings() {
                updateRateUI();
                settingsOverlay.classList.remove('hidden');
            }
            function closeSettings() {
                settingsOverlay.classList.add('hidden');
            }
            settingsBtn.addEventListener('click', openSettings);
            settingsClose.addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', (e) => {
                if (e.target === settingsOverlay) closeSettings();
